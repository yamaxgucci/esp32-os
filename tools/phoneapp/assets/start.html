<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArgonOS</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #151a20; --line: #262e38; --text: #dfe6ee;
    --dim: #8795a5; --accent: #4fb3ff; --good: #5bd17a; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 20px; }
  section { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: .8px; }
  button { font: inherit; color: var(--text); background: #1f2833;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
    cursor: pointer; }
  button.main { background: var(--accent); color: #04121f; border: 0;
    font-weight: 600; width: 100%; }
  button:disabled { opacity: .55; }
  .row { display: flex; gap: 8px; }
  input { font: inherit; color: var(--text); background: #0f1318;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    flex: 1; min-width: 0; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 12px 10px;
    border-top: 1px solid var(--line); cursor: pointer; }
  li:first-child { border-top: 0; }
  li:active { background: #1c232c; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .addr { color: var(--dim); font-size: 12px; }
  .rssi { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .note { color: var(--dim); font-size: 13px; margin-top: 8px; min-height: 1.2em; }
  .note.bad { color: var(--bad); }
  .last { margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>ArgonOS</h1>
  <div class="sub">A board's screen and keyboard on this phone.</div>

  <section>
    <h2>Bluetooth</h2>
    <button class="main" id="scan">Search for boards</button>
    <div class="note" id="bnote">The board needs Bluetooth on (<code>bt on</code>, or <code>[bt] on = yes</code>) and PHONE.SYS loaded.</div>
    <ul id="list"></ul>
    <div class="last" id="lastwrap" hidden>
      <button id="last" style="width:100%"></button>
    </div>
  </section>

  <section>
    <h2>Wi-Fi</h2>
    <div class="row">
      <input id="host" inputmode="url" autocapitalize="off" autocomplete="off"
             spellcheck="false" placeholder="192.168.0.111:8765">
      <button id="go">Open</button>
    </div>
    <div class="note">The board's address on the same network. <code>argon.local</code> works where the phone resolves .local names.</div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const seen = new Map();

function openBle(addr, name) {
  store.set("argon.last.ble", JSON.stringify({ addr, name }));
  if (window.ArgonBle) ArgonBle.stopScan();
  location.href = "term.html?ble=" + encodeURIComponent(addr) +
                  "&name=" + encodeURIComponent(name || addr);
}

function render() {
  const ul = $("list");
  ul.textContent = "";
  const rows = [...seen.values()].sort((a, b) => b.rssi - a.rssi);
  for (const d of rows) {
    const li = document.createElement("li");
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = d.name || "(no name)";
    const a = document.createElement("div");
    a.className = "addr";
    a.textContent = d.addr;
    n.appendChild(document.createElement("br"));
    n.appendChild(a);
    const r = document.createElement("div");
    r.className = "rssi";
    r.textContent = d.rssi + " dBm";
    li.append(n, r);
    li.onclick = () => openBle(d.addr, d.name);
    ul.appendChild(li);
  }
}

/* Called by the app. */
window.onBoard = (addr, name, rssi) => {
  const old = seen.get(addr);
  seen.set(addr, { addr, name: name || (old && old.name) || "", rssi });
  render();
};
window.onScanStarted = () => {
  $("scan").disabled = true;
  $("scan").textContent = "Searching…";
  const n = $("bnote"); n.classList.remove("bad");
  n.textContent = "Boards advertising the ArgonOS service appear below.";
};
window.onScanStopped = () => {
  $("scan").disabled = false;
  $("scan").textContent = "Search again";
  if (seen.size === 0) $("bnote").textContent =
    "Nothing found. Is Bluetooth on at the board (bt on) and PHONE.SYS loaded?";
};
window.onScanError = (msg) => {
  $("scan").disabled = false;
  $("scan").textContent = "Search for boards";
  const n = $("bnote"); n.classList.add("bad"); n.textContent = msg;
};

$("scan").onclick = () => {
  if (!window.ArgonBle) { onScanError("Bluetooth needs the ArgonOS app."); return; }
  seen.clear(); render();
  ArgonBle.scan();
};

try {
  const last = JSON.parse(store.get("argon.last.ble", "null"));
  if (last && last.addr) {
    $("lastwrap").hidden = false;
    $("last").textContent = "Reconnect to " + (last.name || last.addr);
    $("last").onclick = () => openBle(last.addr, last.name);
  }
} catch (e) {}

$("host").value = store.get("argon.last.host", "");
function openWifi() {
  let h = $("host").value.trim();
  if (!h) return;
  h = h.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!/:\d+$/.test(h)) h += ":8765";
  store.set("argon.last.host", h);
  location.href = "http://" + h + "/";
}
$("go").onclick = openWifi;
$("host").addEventListener("keydown", (e) => { if (e.key === "Enter") openWifi(); });
</script>
</body>
</html>
