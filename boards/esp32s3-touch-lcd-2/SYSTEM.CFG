; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by `argon sysfs -p COM<n>`.  The
; running system rewrites the file whenever something has to be remembered -
; `drv install` adds a device line, `wifi connect` stores an SSID - so the two
; drift apart, and flashing this again is a deliberate reset to a known board
; rather than an update.
;
; A password is never written here by anything but the owner of the board.

[modules]
; The panel driver, and this board's own build of it: the constants inside
; (chip select 45, data/command 42, no reset line, backlight 1, landscape
; 320x240) are this board's and no other image's.  See modules.txt.
device = c:\drv\st7789lcd2.sys
; The wire to whichever board this leaf ends up beside.  NODELINK.SYS is the
; S3's build - NODELN32 is the CYD's (LX6) and NODELNRV the C3's (RISC-V) - and
; the wrong one loads and then throws an illegal instruction somewhere inside
; rather than refusing.
device = c:\drv\nodelink.sys
; The touch driver.  Here rather than in modules.txt alone, because that file is
; what gets STAGED into C:\drv and this one is what gets LOADED: a .SYS that is
; only staged is a driver nobody runs, which is how the merged driver first went
; missing from a boot log that said "2 loaded, 0 failed".
;
; WHAT IT WILL SAY ON THIS UNIT, and it is the expected outcome rather than a
; fault: the chip does not answer its address, so the driver refuses to load and
; prints "CST816: nothing answered at 0x15 - the controller is silent (supply,
; reset, or address)".  No touch0 is published and `dev` lists none.  See
; modules.txt for the I2C scan and why the silence is a hardware question.
; NOT LOADED ON THIS UNIT, AND THE REASON IS MEASURED RATHER THAN TIDINESS.
; The controller is dead (it is the RMA one), and the driver's probe does not
; always fail quickly: on 23 Sep this board was caught hanging IN THE BOOT at
; exactly this line - 5414 bytes of log and then silence, no shell, no prompt.
; It is intermittent, and the boot time swings from 0.22 s to 5.5 s when it
; does come up, which is the I2C probe waiting on a chip that never answers.
;
; That cost most of a day: every run where the far end "never returned from
; spi_link_open" was a board that had never finished booting, and the fault was
; looked for in the SPI service, in the block size and in the clock rate.
;
; Put it back the day a working panel is fitted.
; device = c:\drv\cst816.sys

; ---------------------------------------------------------------------------
; The cluster: which board this is, and which port the wire is on.
;
; The name is how the other board refers to this one - in `ps`, in a device
; name, in `run <name> <program>`.  It is not the pack's directory name and
; nothing derives it: `lcd2` is short like the others (cyd, zero, c3) because
; it is typed.
;
; uart is 1 because [uart1] in BOARD.CFG is the pin pair that is meant to go to
; the other board - GPIO 17 and GPIO 4, on the camera connector, NOT SOLDERED
; YET.  Those two pins are a first guess and the note in BOARD.CFG says so; a
; board that is flashed before that wiring exists is a board whose wire reports
; "far end silent", which is a true statement about the copper.
;
; uart0 was the reason this pair could not be 43/44, and it is the console no
; longer: the pack measured that this socket is the chip's own USB-Serial-JTAG
; and moved the console there (sdkconfig.esp32s3.lcd2), which frees UART0's own
; pads.  The choice below is left as it was - it is about a wire that does not
; exist yet, and BOARD.CFG's [uart1] note is where that decision lives.
; ---------------------------------------------------------------------------
[link]
uart = 1
; 921600 is the driver's own default, written down rather than left implicit.
; NOTHING has been measured on these pins - there is no wire - so this is a
; starting point and not a result.  Run `link` alone first and raise or lower
; it only on evidence; on the S3-Zero, the one pair like this that has been
; measured, 921600 produced 36 bad frames and 597 gaps over a 19 KB file where
; 460800 produced 6 and 54.
baud = 921600
; Bind at boot, by name: `auto` means every link device this board has, and it
; has one.  A board that comes up unbound comes up looking like a board with
; no wire at all, whatever is soldered to it.
bind = auto

; ---------------------------------------------------------------------------
; THE FAST LINK - SPI, and the only wire this board has.
;
; The UART above is still node0 and still has no copper; this is node1, on the
; pads 10..13 that BOARD.CFG's [spi3] block explains.  It is the wire the bench
; pair actually has soldered, so on this board it is the one that carries
; traffic, and `link use node1` is how it is chosen.
;
; role = slave: the other end holds the clock.  A slave sends when it is clocked,
; not when it feels like it, which is the whole reason the driver's task sits
; inside a transaction waiting for one instead of polling a port.
; ---------------------------------------------------------------------------
; khz = 5000 AND NOT 20000, AND IT IS A PROPERTY OF THE SOFTWARE, NOT THE WIRE.
; The cable is clean to 40 MHz - 4000 frames of 4000, 1 755 781 B/s, measured on
; this pair on the separate rig - so this number is not what the copper can do.
; It is what the link on top of it does best today.  Same 19212-byte fetch,
; 22 Sep, everything else equal:
;
;     20 MHz  11 875 B/s   1376 blocks   43 gaps
;      5 MHz  19 192 B/s   1048 blocks   40 gaps
;      1 MHz  never finished, 1173 bad frames (the rig says the same at 1 MHz)
;
; A QUARTER SLOWER A CLOCK CARRYING HALF AGAIN AS MUCH is the shape of a link
; whose cost is LOSS rather than bandwidth: a faster clock lets the master push
; more blocks at a slave that is not ready for them, and each one it is not
; ready for costs a frame and a go-back-N window.  Put this back to 20000 the
; day the loss is fixed, and measure it rather than assuming.
[linkspi]
role = slave
bus  = 3
cs   = 10
khz  = 5000
dev  = node1

[cluster]
name = lcd2
; This board is a LEAF.  It has one wire, to whichever board is at the other
; end of it - the CYD, the C3 or the Zero; that is a decision about the wiring,
; not about this file, and nothing in the pack assumes which one.
;
; There is no Master and no Slave here, because the role is per request: this
; board is a screen for its neighbour's compute when it is asked to be, and the
; one asking for work back when it wakes.
multiboard = yes

; ---------------------------------------------------------------------------
; OFF, and the zero is a decision rather than a default left alone.
;
; A leaf with a screen, a card and eight megabytes of PSRAM is the most
; plausible board in this cluster to be given work while something smaller
; sleeps - but that is a hypothesis and nothing about standby has been run on
; this board.  Turn it on after the wire exists and the link scenario is green,
; in minutes rather than seconds, the way the CYD's pack argues it.
; ---------------------------------------------------------------------------
standby_after = 0

; ---------------------------------------------------------------------------
; THE CONSOLE'S GRID IS THE PANEL'S OWN, and `auto` is the whole of what says
; so.
;
; The firmware's built-in console is eighty by twenty-five cells.  This glass
; holds forty by thirty - the driver reports 320/8 by 240/8 - so without these
; two lines the console runs eighty columns wide on a forty-column screen and
; every line is cut off halfway across.  `auto` asks the panel driver first and
; falls back to the framebuffer, which is the answer either way here; it is
; asked twice during boot on purpose (see apply_console_size in
; components/argon_kernel/src/boot/kernel.c), because a board whose panel is a
; loadable .SYS has no panel to ask at the devices stage.
;
; The CYD's pack sets the same two lines, and for a second reason as well: on a
; board whose touch driver reports in console cells the grid is the unit the
; driver reports in.  That reason does NOT apply here - cst816.sys reports
; pixels (AG_PTR_PIXELS), not cells - so this is only about the text fitting,
; and the touch driver above is a load-time refusal on this unit either way.
; ---------------------------------------------------------------------------
[console]
cols = auto
rows = auto
