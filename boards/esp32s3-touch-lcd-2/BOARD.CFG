; ArgonOS - Waveshare ESP32-S3-Touch-LCD-2 (SKU 29667; 29668 is the "-C"
; variant with a second camera/expansion connector).
;
; Copy this onto the board's own flash as C:\BOARD.CFG:
;
;   python tools\boardtest.py -p COM<n> --put "boards\esp32s3-touch-lcd-2\BOARD.CFG=c:\board.cfg"
;
; On the board itself:  edit c:\board.cfg
;
; The chip is an ESP32-S3R8: 16 MB flash, 8 MB OCTAL PSRAM, and one Type-C
; socket whose wiring is discussed at the bottom of this file.  The panel is a
; 2 inch 240x320 IPS on an ST7789T3 over SPI, the touch controller is a CST816D
; and the IMU a QMI8658, both on one I2C bus, and the TF card is on SPI.
;
; WHERE EVERY NUMBER BELOW COMES FROM.  Nothing here was measured on hardware
; yet - this board has not been flashed by ArgonOS.  The pins are WaveShare's
; own wiring, read out of the vendor example package the same way the CYD's
; were read off its board:
;
;   D:\Work\waveshare-s3-lcd2\demo\ESP-IDF\01_sd_card_test\main\sd_card_example_main.c
;       card: MISO 40, MOSI 38, CLK 39, CS 41
;   D:\Work\waveshare-s3-lcd2\demo\ESP-IDF\06_lvgl_example\main\main.c
;       panel: SCLK 39, MOSI 38, MISO 40, DC 42, CS 45, RST -1, BL 1,
;              240x320, invert_color(true)
;       touch/IMU I2C: SDA 48, SCL 47
;   D:\Work\waveshare-s3-lcd2\demo\ESP-IDF\05_lvgl_camera\main\main.c
;       the same numbers again, plus the camera pin list below
;   D:\Work\waveshare-s3-lcd2\demo\Arduino\examples\01_factory\bsp_i2c.h
;   ...\01_factory\bsp_lv_port.h, ...\02_gfx_helloworld\02_gfx_helloworld.ino
;       the Arduino side: I2C 48/47, LCD BL 1, RST -1, rotation 1 (landscape),
;       "true /* IPS */" on the panel constructor
;
; The vendor's ESP-IDF examples are the authority for the ESP-IDF path and the
; Arduino ones for the second opinion; where they agree (every line above
; except the camera's GPIO 2) they are the board.

[board]
name = esp32s3-touch-lcd-2
; The chip, so that a C: image cannot be laid out for the wrong board.
; The partition tables differ between them - where C: starts and how
; big it is - and an image built against the wrong one lands at the
; wrong offset or takes half the room it should.  Both mount.  Both
; work.  One of them runs out of space months later.
chip = esp32s3

; ---------------------------------------------------------------------------
; THE PANEL AND THE CARD SHARE ONE BUS, and that is the first thing to know
; about this board.
;
; SCLK 39, MOSI 38 and MISO 40 go to the panel and to the card slot together;
; only the chip selects tell them apart - 45 for the panel, 41 for the card.
; This is not a wiring mistake and not a board-specific trick: WaveShare's own
; two examples initialize the SAME host (SDSPI_HOST_DEFAULT() is SPI2_HOST, and
; the panel is EXAMPLE_SPI_HOST = SPI2_HOST) and the card example's own comment
; says so.  So both sections below name spi_host = 2, and the port is asked for
; the same three pins twice.
;
; That is supported, and the C6-LCD-1.47 pack is the working proof: [spi2] and
; [sd] there are one bus with two chip selects.  What makes it safe is on the
; port side, not in this file:
;
;   components/argon_port/idf/src/storage_hw.c mount_spi() initializes the bus
;   only if it is not up (s_bus_up[]) and treats ESP_ERR_INVALID_STATE as
;   success - "somebody else may already own the bus, which is fine";
;   components/argon_port/idf/src/io_hw.c ag_port_spi_open() does the same from
;   the other direction, and keeps ONE spi_device per chip select with a clock
;   of its own (AG_PORT_SPI_DEVS), because the panel runs at tens of megahertz
;   and the card at twenty.
;
; The one consequence worth writing down: whichever side comes up first fixes
; the bus's pin mapping and its maximum transfer size, so the two sets of pins
; below must stay identical.  They are, deliberately - a card wired to 38/39/40
; while the panel is initialized on 39/38/40 is a bus that works until the
; order of two init calls changes.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; TF card - drive A:.
;
; SPI and not SDMMC: the card's four data lines are not wired, only one, and
; the slot shares its clock and data with the panel.  spi_host = 2 is the
; port's numbering for SPI2 (AG_PORT_SPI_HOST_OF subtracts one), which is also
; the host WaveShare's sdspi example uses.
;
; 20 MHz to start, which is SDSPI's own default and the same number the C6 pack
; carries for a card on the panel's wires.  A card that mounts and then reads
; garbage is the first thing to blame on this number.
;
; THE TRAP ON THIS BOARD, MEASURED, AND WHAT THE KERNEL NOW DOES ABOUT IT.
;
; GPIO 45 is the panel's chip select AND a strapping pin, so nothing drives it
; until software claims it, and what it reads as out of reset is the chip's own
; pull-down on that strap: low.  While it is low the ST7789 reads itself as
; selected, and a selected ST7789 drives its SDO onto MISO 40 - the wire the
; card answers on - so the card's replies arrive corrupted.
;
; Measured on this board with the vendor's own card example (01_sd_card_test),
; one boot, A/B/A:
;
;   drive GPIO 45 HIGH before touching the card -> mount SUCCESS
;       (card "asdfg", SDHC, 7690 MB, FAT32)
;   leave it as it comes out of reset (floating low) -> mount FAILED,
;       sdmmc_init_ocr: send_cond returned 0x109 / ESP_ERR_INVALID_CRC
;   HIGH again -> SUCCESS
;
; So the requirement is exact: the panel's chip select must be DEASSERTED HIGH
; before any card access.  `cs_hold` under [sd] below is that, and the kernel
; drives the pin high before the SPI bus comes up - which is why the boot mount
; of A: no longer needs a driver to have loaded first (the card is mounted at the
; MEDIA stage and loadable .SYS drivers load at MODULES, after it).  The other
; way out was moving the media mount after the modules stage, which is a
; boot-order change for every board and was not taken.
; ---------------------------------------------------------------------------
[sd]
interface = spi
spi_host  = 2
sck       = 39
mosi      = 38
miso      = 40
cs        = 41
max_khz   = 20000
; The panel's chip select, which is not the card's - see the measurement just
; above and ag_board_sd_t.cs_hold for the whole of it.  Absent on any board
; where the two do not share a bus, and the port then touches no pin.
cs_hold   = 45

; ---------------------------------------------------------------------------
; The bus itself - SPI2, the panel's and the card's.
;
; khz = 40000 is the default for a device that does not name its own speed, and
; the ST7789 driver does not name one.  It is half of what this board is known
; to take: WaveShare's example clocks the same panel at 80 MHz
; (EXAMPLE_LCD_PIXEL_CLOCK_HZ) through the same GPIO matrix - 39/38/40 are not
; SPI2's IOMUX pins on this chip, those are 10..13 - and 40 is where the other
; two panels in this tree start.  Raise it on evidence, and not before: these
; wires also carry the card, and a bus that is too fast shows up as a card that
; mounts and then misreads.
; ---------------------------------------------------------------------------
[spi2]
sck  = 39
mosi = 38
miso = 40
khz  = 40000

; ---------------------------------------------------------------------------
; I2C0 - the CST816D touch controller and the QMI8658 IMU, on one bus.
;
; 400 kHz, which is what every vendor example configures for this bus
; (i2c_conf.master.clk_speed = 400000 in 02..06), not the 100 kHz default: the
; rate is the board's and the chips on it are expected to answer at it.  The
; IMU does; see the measurement below.
;
; The addresses, for the shell before any driver exists - `io i2c 0` walks the
; bus and these are the two the board has:
;
;   CST816D  0x15   register 0xA7 reads back 0xB6 (vendor lib: bsp_cst816)
;   QMI8658  0x6B   (vendor IDF example: QMI8658_SENSOR_ADDR)
;
; Nothing in this pack claims either chip: see modules.txt.  The bus is
; configured anyway, because it is wiring and because `io i2c 0` is the tool
; that proves the wiring before a driver exists.
;
; MEASURED ON THIS BOARD, and it changes nothing in the pack: a scan of this bus
; (port 0, addresses 0x08..0x77) found exactly ONE device - 0x6B, the QMI8658.
; Nothing answers at the CST816D's 0x15.  The bus and the two pins are
; therefore right, and the touch controller is silent: asleep, unpowered, or not
; fitted, which is unresolved and is a hardware question.  Nothing in ArgonOS is
; implicated, because ArgonOS has no CST816 driver at all - see modules.txt.
; The touch controller also has neither INT nor RST wired on this board, so a
; driver for it would have no interrupt to hang on and no reset line to pulse:
; it would poll register 0x02 and read 0x03..0x06.
; ---------------------------------------------------------------------------
[i2c0]
sda = 48
scl = 47
khz = 400
pullups = yes

; ---------------------------------------------------------------------------
; Touch - the CST816D on the bus above, through c:\drv\cst816.sys.
;
; rotation = 3, and it is a derivation rather than a measurement: the vendor's
; Arduino port compensates this landscape panel (MADCTL 0x60) with, for its
; rotation 1, x = y and y = 240-1-x, which is this driver's rotation 3 exactly -
; so the span after the turn is 320x240 and the kernel scales it one to one onto
; [display] 320x240.  A quarter turn is not the whole answer, though: rotation 1
; and rotation 3 are the two landscapes, 180 degrees apart, so a pointer that
; lands diagonally opposite the finger wants rotation = 1; if neither turn
; matches, what is left is a flip bit.  One stroke of apps/touch.axe settles it,
; because the demo prints where it thinks the finger was.
;
; width/height are the controller's OWN frame, portrait, before any turn - one
; pair, not two: the rotation swaps them.  int = -1 because this board routes
; neither INT nor RST to a GPIO, so the driver polls the bus.
;
; NOTHING IN THIS BLOCK HAS BEEN EXERCISED ON THIS UNIT, and that is the one
; thing here that is not derived: the controller does not answer a scan of this
; bus (see [i2c0] above and modules.txt), so cst816.sys refuses to load and
; publishes no touch0.  The numbers stand as the vendor's own answer for this
; module; the silence is a hardware question.
; ---------------------------------------------------------------------------
[touch]
bus      = 0
addr     = 0x15
width    = 240
height   = 320
rotation = 3
flip_x   = false
flip_y   = false
int      = -1

; ---------------------------------------------------------------------------
; The soft framebuffer applications draw into.
;
; TWO THINGS SHARE THIS GLASS, as on every ArgonOS board with a panel:
;
;   The console arrives as characters - c:\drv\st7789lcd2.sys turns one row of
;   cells at a time into pixels with a five kilobyte row buffer and no
;   framebuffer anywhere.  That is what is on the screen at the prompt and it
;   is the same file the panel is driven by.
;
;   The surface below is what *applications* draw into, and its size is a
;   memory decision.  320x240 in RGB565 is 150 KB, and it matches the glass
;   exactly, so the driver's presentation is one to one: no scaling, no
;   margins, no resampling (apps/st7789/st7789.c, lcd_blit_rect).
;
; WHY 320x240 AND NOT A SMALLER SURFACE, as the CYD has (160x120) and the C6
; has none at all: those are 203 KB and 240 KB machines, where the surface and
; the system fight over the same SRAM.  This board has 8 MB of PSRAM, and the
; kernel asks for slow memory first (the same mechanism the S3-Zero's pack
; records for its own 320x240 surface), so the 150 KB comes out of PSRAM and
; the internal RAM the system lives in is untouched.  `driver = panel` - the
; CYD's and the C6's answer - would buy back memory this board does not need
; and take away the surface an application asks the kernel for (gfx->acquire),
; which is what GFXDEMO, FCDESKTOP and the emulators use.  Put `panel` back if
; this board is ever run as a pure screen for somebody else's compute.
;
; The numbers are landscape, the way the driver addresses this panel: the
; ST7789T3's own memory is 240x320 and the driver turns it on its side
; (MADCTL 0x60), so the console grid is 40x30 cells of 8x8.
; ---------------------------------------------------------------------------
[display]
driver = soft
width  = 320
height = 240

; ---------------------------------------------------------------------------
; UART1 - the wire this board is a cluster leaf on.
;
; NOTHING IS SOLDERED YET, and this is a first guess rather than a fact, stated
; as such: the S3-Zero's pack carried a first-guess pin pair for a wire that
; did not exist either, and the CYD's pack records what a wrong guess costs (a
; card that never mounts while everything else looks healthy).  Check it
; against the board before soldering, and correct this file afterwards.
;
; Where the pins can come from.  Everything else is spoken for: 1 is the
; backlight, 38/39/40/41/42/45 the panel and the card, 47/48 the I2C bus,
; 43/44 are UART0 - the console, as the vendor pin map gives it (and 19/20 is
; the chip's own USB, so there is no spare serial port either) - 26..37 belong
; to the flash and to the octal PSRAM on an R8 module (the vendor pin map names
; its CS and CLK as 26 and 30), and 0/3/45/46 are strapping pins (45 is also the
; panel's chip select - WaveShare wired it so, and the note under [sd] is what
; that costs).  That leaves 4, 5, 6..17, 18 and 21 - and 5 is the battery sense
; (see the board list below), while of the rest the only ones that come out on a
; connector are the camera's: 4, 6..17 and 21 on the 24-pin FPC.  Where GPIO 18
; goes on this board is not written down anywhere I found, so it is not a pin
; to build a wire on.
;
; So the wire is two of the camera's:
;
;   uart1  GPIO 17 (tx) -> the other board's rx
;          GPIO  4 (rx) <- the other board's tx
;   GND    common to both boards.  Without it the wire works "almost", which
;          is the worst way for a wire to work.
;
; 17 is the camera's PWDN line and neither vendor example uses it (OV5640
; resets itself; the IDF example assigns it and comments "power down is not
; used"), so a wire there costs the camera nothing.  4 is HREF, which the
; camera does need - that is the price of a two-wire link on a board whose
; only free connector is the camera's, and it means the cluster wire and a
; camera module cannot both be plugged in.  Both are ordinary GPIOs, both are
; bidirectional, and neither is a strapping pin.
;
; 115200 here is only the port's default; SYSTEM.CFG binds the wire and names
; the rate it runs at.
; ---------------------------------------------------------------------------
[uart1]
tx   = 17
rx   = 4
baud = 115200

; ---------------------------------------------------------------------------
; The rest of the board, read off the vendor documentation and the examples.
;
;   camera          a 24-pin FPC socket for an OV2640/OV5640.  Both vendor
;                   examples agree on the pins: XCLK 8, SCCB sda 21, sccb scl
;                   16, PWDN 17, D0 12, D1 13, D2 15, D3 11, D4 14, D5 10,
;                   D6 7, D7 2, VSYNC 6, HREF 4, PCLK 9.
;                   NOTE GPIO 2: the connector is documented as 14 signals and
;                   does not list it, but BOTH vendor examples (Arduino
;                   app_camera.h and IDF 05_lvgl_camera/main.c) assign Y9/D7 to
;                   GPIO 2.  Written down here because a camera driver written
;                   from the connector list alone would be one data line short
;                   and would show it as a picture with a doubled half.
;   IMU             QMI8658 on the I2C bus above, address 0x6B.  No ArgonOS
;                   driver exists for it.
;   battery         MX1.25 connector and a charge/discharge chip - the board
;                   runs off a cell with the cable out.  The battery voltage is
;                   sensed on GPIO 5 (ADC1 channel 4): IDF 04_lvgl_battery
;                   defines EXAMPLE_BATTERY_ADC_CHANNEL ADC_CHANNEL_4 and the
;                   Arduino port EXAMPLE_PIN_NUM_BAT 5.  That is one reason the
;                   wire above does not use 5: on this board `io adc 4` reads
;                   the cell, and 5 is the pin that looks most free.
;   USB             one Type-C socket, and the vendor pin map gives both paths
;                   on this board: UART0 on 43/44 (the console) and the chip's
;                   own native USB on 19/20.  Which of the two the socket
;                   itself carries is not written down anywhere I found, and it
;                   does not change the pack: the console stays on UART0,
;                   because that is what the vendor's own examples run with,
;                   and the one line that moves it to USB-Serial-JTAG is in
;                   sdkconfig.esp32s3.lcd2.  What a boot log settles is only
;                   whether the console is visible on that socket.
;
; Do not configure GPIO 26..37: on an R8 module that is the flash and the octal
; PSRAM.  The system refuses them, which is the point of the pin table.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; SPI3 - THE FAST LINK, AND WHY IT IS NOT SPI2.
;
; SPI2 here is the panel and the card (39/38/40 above), and a bus is either a
; master or a slave for as long as it is up.  The link cannot borrow it, so it
; goes on the chip's second general-purpose host and reaches the soldered pads
; 10..13 through the GPIO matrix.
;
; Those four pads are the ones the pair was soldered on, and on the Zero - where
; 10..13 are SPI2's own IOMUX pins - they need no matrix at all.  Here they do,
; and that is a deviation from the one configuration measured on the bench, said
; out loud rather than discovered later: the probe ran both ends on SPI2.  So if
; the slave side will not keep up at 40 MHz, the fallback is one line per board
; and no new code - make THIS board the master on SPI2 beside the panel (a third
; chip select on a bus that already carries two: 45 panel, 41 card, 10 link) and
; the Zero the slave on its own SPI2.  That role swap was measured clean to
; 20 MHz, and it is why the driver takes its role from a configuration file.
;
; drive = 0 is part of the wiring, not a preference.  Measured on this pair on
; 22 Sep: at the pad drive the chip comes up with, 0 clean frames of 4000; at
; the weakest, 4000 of 4000 from 1 to 40 MHz.  See the Zero's pack and
; "Привод площадок: CAP_0" in docs/plans/cluster.md.
; ---------------------------------------------------------------------------
[spi3]
sck   = 12
mosi  = 11
miso  = 13
khz   = 20000
drive = 0
