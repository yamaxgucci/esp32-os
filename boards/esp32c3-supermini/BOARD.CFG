; ArgonOS - ESP32-C3 SuperMini.
;
; Flashed onto the board's own C: together with SYSTEM.CFG:
;
;   python tools\mksysfs.py --board boards\esp32c3-supermini --flash -p COM<n>
;
; A board with nothing on it: no display, no card slot, no sound. Thirteen
; pins on a header, a green LED, and a USB-C socket wired straight to the chip.
; That makes it a good second node and a bad first one - it can hold a program
; and a wire, and it must borrow a screen from whoever has one.

[board]
name = esp32c3-supermini
; The chip, so that a C: image cannot be laid out for the wrong board.
; The partition tables differ between them - where C: starts and how
; big it is - and an image built against the wrong one lands at the
; wrong offset or takes half the room it should.  Both mount.  Both
; work.  One of them runs out of space months later.
chip = esp32c3

; ---------------------------------------------------------------------------
; UART1 - the wire to the other board.
;
; WHICH PINS ARE FREE, and why the rest are not. The header carries 0..10 and
; 20, 21, and of those:
;
;   2, 8, 9    strapping. 8 also drives the LED, and 9 is the boot-mode pin:
;              held low through a reset the board comes up in the downloader
;              instead of running, which looks exactly like a board that has
;              stopped booting.
;   11..17     the flash inside the module. Not on the header, and the system
;              refuses them.
;   18, 19     USB D- and D+, which is the console. Taking them costs the only
;              way to talk to this board.
;   20, 21     UART0. Free in principle - the console is on USB, not here - but
;              left alone: the ROM bootloader still prints on them, and having
;              a second thing driving a pin the ROM writes to is a fault that
;              only appears at reset.
;
; So: 0, 1, 3, 4, 5, 6, 7, 10.  Any of them would do - the C3 routes a UART to
; any pin through the matrix - and these two are what is actually soldered:
; 4 out to the CYD's IO35, 3 in from its IO22.
;
; THE THIRD PIN OF THE CYD IS NOT USED, and that is deliberate twice over.  Its
; IO21 reads high through both internal pulls, which no floating pin does, and
; nothing in that board's documentation says why; until it is understood it is
; not a pin to build on.  And nothing is lost: a UART needs two wires and a
; ground, because flow control here lives in the protocol.  The third wire is
; the GROUND, without which the two boards have no common zero to measure a
; high against - they are powered from different USB sockets - and the link
; works intermittently in a way that reads as bad soldering or too high a baud.
;
; The other end decides which is which: the CYD's receiver can only be IO35,
; because that pin is input-only. On the S3 the pair is 42 (its transmitter)
; and 41.
; ---------------------------------------------------------------------------
[uart1]
tx   = 4
rx   = 3
baud = 115200

; ---------------------------------------------------------------------------
; No display, no card, no sound - said out loud rather than left out.
;
; A missing section and a section saying "none" mean different things to the
; system: the first is a board whose author forgot, the second is a board that
; has none. The cluster leans on the difference - a node with no screen asks
; the neighbour for one, and it can only ask if it knows.
; ---------------------------------------------------------------------------
[display]
driver = none

[sd]
interface = none

; ---------------------------------------------------------------------------
; The rest of the board, for whoever wires something to it next.
;
;   LED             GPIO 8, active LOW, and also a strapping pin. Lighting it
;                   at boot is not free: the pin must be high through reset.
;   ADC             GPIO 0..4 are ADC1 channels 0..4.
;   power           5V pin, 3V3 pin, and the USB-C socket. Do NOT feed this
;                   board from another board's 5V while both have USB in:
;                   two supplies meet inside one of the regulators.
;   antenna         a PCB trace at one end of the board. Metal near it - a
;                   desk lamp base, another board lying on top - costs real
;                   range, and this is the part people blame the radio for.
; ---------------------------------------------------------------------------
