; ArgonOS - what this board loads at boot, and the state it remembers.
;
; Flashed as part of C: by:
;
;   python tools\mksysfs.py --board boards\esp32c3-supermini --flash -p COM<n>
;
; The running system rewrites this file whenever something has to be
; remembered, so the flashed copy and the board's own drift apart; flashing it
; again is a deliberate reset to a known board rather than an update.

[modules]
; The wire, and nothing else - there is nothing else on this board to drive.
; NODELNRV.SYS is the RISC-V build: the same source as the S3's NODELINK.SYS
; and the CYD's NODELN32.SYS, compiled for rv32imc.  An image for the wrong
; instruction set does not refuse to load; it loads and throws an illegal
; instruction somewhere inside, which reads as a driver bug.
device = c:\drv\nodelnrv.sys

; ---------------------------------------------------------------------------
; The cluster: which board this is, and which port the wire is on.
;
; The name is how the other board refers to this one - in `ps`, in a device
; name, in `run <name> <program>`.  Without it this board answers to node0, a
; number meaning "the wire I am bound to", which says nothing about which board
; is at the other end.
;
; uart 1 is the pin pair in BOARD.CFG (tx 4, rx 3), to the CYD.  uart 0 is the
; second wire, to the S3-Zero, on pins 0 and 1 - NOT on 20/21, which are where
; the ROM bootloader prints its reset banner whatever the matrix is told
; afterwards.  The port was never the problem; those two pins were.
;
; 921600 is the driver's own default, written down rather than left implicit.
; This is a NEW pair of wires: nothing has been measured on it, and the number
; measured on the S3-to-CYD pair (clean to 5 Mbaud) says nothing about this
; one.  Start here, run `link` alone first, and raise it only on evidence.
; ---------------------------------------------------------------------------
; Half of a cluster, and it says so here rather than in a batch file.  See the
; CYD's SYSTEM.CFG for what `multiboard = none` refuses and why there is no
; Master or Slave.
[cluster]
name = c3
multiboard = yes

; ---------------------------------------------------------------------------
; TWO WIRES: this board is the middle of the three.
;
; Not for being the best at it - it is one core and 400 KB, the smallest of
; the three - but for what the other two have left.  The CYD has one free pin
; after its own wire and a second wire needs two; the Zero could hold both, but
; only by unsoldering the CYD-C3 pair, which is the pair that has been proved
; on hardware.  A third board adds to what works.
;
; There is no Master and no Slave, and holding two wires does not make this
; board in charge - the role belongs to whoever is asking.  What it does mean
; is that a message between the CYD and the Zero passes through here, which is
; the one thing a middle costs, and that the smallest board pays it.
;
;   link   uart1 -> the CYD   (a screen, a card, a converter)
;   link2  uart0 -> the Zero  (two cores, PSRAM and a DAC)
; ---------------------------------------------------------------------------
[link]
uart = 1
baud = 921600

; `bind` IS READ FROM [link] AND FROM NOWHERE ELSE.  The kernel asks for the
; key "link.bind" (ag_node_autobind, src/net/nodeboot.c) and a section header
; carries its keys until the next header - so with this line under [link2] it
; became "link2.bind", which nothing reads, blank line or no blank line.  The
; board then comes up bound to NOTHING, which looks exactly like a broken wire,
; and the middle of a cluster has no console to say otherwise.
;
; `auto` is every link device this board has, which is now two.  Naming them
; one by one would be a list that goes stale the first time a wire moves.
bind = auto

[link2]
uart = 0
; 460800, not the 921600 the other wire uses, and this is measured rather than
; preferred: on THIS bench the Zero's wire at 921600 gave 36 bad frames and 597
; gaps over a 19 KB file, against 6 and 54 at 460800 - the file arrived intact
; either way, but only because the link spent its time retransmitting.  The rate
; was being overridden at runtime in c:\system.cfg, which a reflash of C: wipes,
; so it belongs here.
baud = 460800

; ---------------------------------------------------------------------------
; The board-to-board wires (the kernel's framed link, spi_link_open2 with a
; frame of 0).  `frame` is the LARGEST frame this board will take, in bytes,
; a multiple of 64: the two ends of a wire say theirs when the link opens and
; both run at the smaller, so each board allocates only for its own.
; The C3 has some 80 KB free with no radio, and a framed link costs about ten
; frames of memory (armed frames, the ring it sends again from, the ring it
; receives into): 2 KB frames are ~20 KB, 4 KB ones ~40 KB.
; ---------------------------------------------------------------------------
[wire]
frame = 2048
