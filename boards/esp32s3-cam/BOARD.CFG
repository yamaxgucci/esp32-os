; C:\BOARD.CFG - ESP32-S3-WROOM CAM board, no vendor marking beyond
; 127294G_Y1127_231016 on the silkscreen.  N16R8: 16 MB Boya flash, 8 MB octal
; PSRAM (AP Memory, 64 Mbit, 80 MHz), camera socket, microSD slot.
;
; First guess, not a fact.  The pins below are the layout the boards of this
; family copy from each other (Freenove ESP32-S3-WROOM, ESP32-S3-EYE and the
; clones of both): the card on SDMMC one bit wide, the camera's SCCB on 4 and
; 5.  Anything here that turns out wrong belongs in the log next to what the
; board actually answered.
[board]
name = esp32s3-cam

[sd]
interface = sdmmc
width = 1
clk = 39
cmd = 38
d0  = 40
max_khz = 20000

; The camera's SCCB is an ordinary I2C bus, so the shell can look for the
; sensor with `io i2c 0` before a line of camera code exists: OV2640 answers at
; 0x30, OV3660 and OV5640 at 0x3c.  A sensor with no XCLK may not answer at
; all - that is the next thing to find out, not a fault.
[i2c0]
sda = 4
scl = 5
khz = 100
pullups = yes

; The I2S pins an amplifier goes on.  A MAX98357A was soldered here and has
; since been removed, so as this board stands there is nothing on the far end
; of these three lines - /dev/pcm0 comes up and plays into open air, and
; nothing in software can tell.  The numbers stay because they are the wiring,
; not the part: putting an amplifier back is a card and four wires, not a
; rebuild.
[audio]
bclk = 47
ws   = 48
dout = 21
rate = 22050

; The soft framebuffer applications draw into - and, on this board, the picture
; that leaves down the wire rather than one that lands on any glass here.
;
; 320x240 is not a memory decision here (there are eight megabytes of PSRAM);
; it is the far end's panel.  ag_gfx_present places a picture at a whole-number
; scale, so a surface that is not the panel's size or an exact multiple of it
; gets centred at scale one and cropped - 640x400 on 320x240 shows the middle of
; the frame and nothing else.  Matching it exactly is what makes the link a
; monitor rather than a magnifying glass.
;
; It also happens to be what Fallout wants: the engine draws 640x480 and halves
; it on the way out (apps/fallout/port/sdl_shim.cc), and 320x240 is that half.
;
; The console still renders into this surface as a fallback for `gfxdump`, and
; at 320x240 an eighty-column console does not fit in it - which costs nothing,
; because the console reaches the far end as characters through REMDISP.SYS and
; not as pixels.
[display]
driver = soft
width  = 320
height = 240

; UART1 - the wire to the second board.  This one goes to an ESP32-2432S024
; ("CYD") whose three free pins make it a screen for a machine that has none:
; 42 out to its IO35 (input-only there, which is what a receiver wants), 41
; back from its IO22, and a common ground.  There is no third wire and no
; hardware handshake - the CYD has no pin left for one - so flow control
; belongs to the protocol on top, not to an RTS line.
;
; The baud here is only the port's default.  Whoever owns the link raises it:
; the useful range on a hand-soldered pair is megabaud, and where exactly it
; stops is a measurement, not a constant.
[uart1]
tx   = 42
rx   = 41
baud = 115200

; The DVP camera on the socket - gone, and the pins with it.
;
; The panel below took 10, 11, 12 and 13, four of the camera's data lines, and
; there was no other choice: of the pins this board brings out to a header
; (3v3, EN, 4, 5, 6, 7, 15, 16, 17, 18, 3, 46, 10, 11, 12, 13, 5v) every one
; but 3 and 46 belongs to the camera, and a display needs six.
;
; The section stays here, commented, because it is the wiring of the socket and
; that has not changed: putting the camera back is unsoldering the panel and
; uncommenting this, not finding the numbers a second time.  Only the
; built-in-camera image reads it (CONFIG_ARGON_CAMERA_BUILTIN, `argon target
; esp32s3-cam`); the default image's camera is the loadable GC2145.SYS, which
; knows the same wiring by itself - so on this board, as it now stands, loading
; GC2145.SYS drives the panel's pins.  Do not load it.
;
;[camera]
;sensor   = gc2145
;xclk     = 15
;pclk     = 13
;vsync    = 6
;href     = 7
;d0       = 11
;d1       = 9
;d2       = 8
;d3       = 10
;d4       = 12
;d5       = 18
;d6       = 17
;d7       = 16
;sccb_sda = 4
;sccb_scl = 5
;pwdn     = -1
;reset    = -1
;xclk_hz  = 20000000

; ---------------------------------------------------------------------------
; Display - ST7789 on a 2.0 inch 240x320 module (020-06PS V2.2, GM1020-06
; flex), soldered to the header and driven landscape as 320x240.
;
; These are SPI2's IOMUX pins, and that is why they were chosen rather than any
; other four: on this part FSPICS0 is 10, FSPID 11, FSPICLK 12 and FSPIQ 13
; (soc/spi_pins.h), so the panel reaches the peripheral directly instead of
; through the GPIO matrix.  SPI3 has no IOMUX pins at all, which is what caps
; the C6 board's panel at 40 MHz.  40 MHz here is a starting point, not the
; ceiling; how far hand-soldered leads go is a measurement.
;
; miso is -1 because this panel cannot answer: the module breaks out one data
; line.  Nothing can read the ST7789's ID register, the driver cannot check its
; own work, and 13 - which would have been MISO - carries DC instead.
;
; The control lines are constants inside c:\drv\st7789.sys, because a driver
; cannot read this file (api->cfg is NULL).  They are written down here for the
; person who comes looking:
;
;   CS 10   DC 13   RES 3   BL 46
;
; 46 carries the backlight rather than the chip select on purpose.  It is a
; strapping pin, it has to be low through reset, and it has an internal
; pull-down; the module's BL is a transistor base and pulls the same way, while
; its CS may carry a pull-up to VDD - and a pull-up on 46 is a board that comes
; up in download mode instead of the system.
; ---------------------------------------------------------------------------
[spi2]
sck  = 12
mosi = 11
miso = -1
khz  = 40000

; The bright white light next to the silkscreen "48" is an addressable LED, not
; a lamp on a pin: GPIO48 reads low and driving it low changes nothing, because
; the colour is latched inside the device and stays until it is sent another
; one.  Its bits are hundreds of nanoseconds long, so the shell cannot make
; them by writing to a pin - but three bits of SPI carry one bit of its, and at
; 2.4 MHz the pattern 100 is a zero of exactly the right shape.
;
;   io spi 3 92 49 24 92 49 24 92 49 24      ; twenty-four zero bits: off
;
; Only mosi is wired; the LED has no clock and nothing to say back.  It is on
; SPI3 now because the panel wanted SPI2's IOMUX pins and this does not care:
; 2.4 MHz through the GPIO matrix makes the same three bits.
[spi3]
sck  = -1
mosi = 48
miso = -1
khz  = 2400
