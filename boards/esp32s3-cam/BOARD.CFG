; C:\BOARD.CFG - ESP32-S3-WROOM CAM board, no vendor marking beyond
; 127294G_Y1127_231016 on the silkscreen.  N16R8: 16 MB Boya flash, 8 MB octal
; PSRAM (AP Memory, 64 Mbit, 80 MHz), camera socket, microSD slot.
;
; First guess, not a fact.  The pins below are the layout the boards of this
; family copy from each other (Freenove ESP32-S3-WROOM, ESP32-S3-EYE and the
; clones of both): the card on SDMMC one bit wide, the camera's SCCB on 4 and
; 5.  Anything here that turns out wrong belongs in the log next to what the
; board actually answered.
[board]
name = esp32s3-cam

[sd]
interface = sdmmc
width = 1
clk = 39
cmd = 38
d0  = 40
max_khz = 20000

; The camera's SCCB is an ordinary I2C bus, so the shell can look for the
; sensor with `io i2c 0` before a line of camera code exists: OV2640 answers at
; 0x30, OV3660 and OV5640 at 0x3c.  A sensor with no XCLK may not answer at
; all - that is the next thing to find out, not a fault.
[i2c0]
sda = 4
scl = 5
khz = 100
pullups = yes

; The I2S pins an amplifier goes on.  A MAX98357A was soldered here and has
; since been removed, so as this board stands there is nothing on the far end
; of these three lines - /dev/pcm0 comes up and plays into open air, and
; nothing in software can tell.  The numbers stay because they are the wiring,
; not the part: putting an amplifier back is a card and four wires, not a
; rebuild.
[audio]
bclk = 47
ws   = 48
dout = 21
rate = 22050

; The DVP camera on the socket.  Only the built-in-camera image
; (CONFIG_ARGON_CAMERA_BUILTIN, `argon target esp32s3-cam`) reads this: there
; esp32-camera lives in the firmware and brings /dev/cam0 up at boot from these
; pins.  The default image ignores the section - its camera is the loadable
; GC2145.SYS, which knows its own wiring.  SCCB is the same two pins as [i2c0].
; This family (Freenove ESP32-S3-WROOM CAM and the ESP32-S3-EYE it copies) has
; no power-down or reset line to the sensor, so both are left off.
[camera]
sensor   = gc2145
xclk     = 15
pclk     = 13
vsync    = 6
href     = 7
d0       = 11
d1       = 9
d2       = 8
d3       = 10
d4       = 12
d5       = 18
d6       = 17
d7       = 16
sccb_sda = 4
sccb_scl = 5
pwdn     = -1
reset    = -1
xclk_hz  = 20000000

; The bright white light next to the silkscreen "48" is an addressable LED, not
; a lamp on a pin: GPIO48 reads low and driving it low changes nothing, because
; the colour is latched inside the device and stays until it is sent another
; one.  Its bits are hundreds of nanoseconds long, so the shell cannot make
; them by writing to a pin - but three bits of SPI carry one bit of its, and at
; 2.4 MHz the pattern 100 is a zero of exactly the right shape.
;
;   io spi 2 92 49 24 92 49 24 92 49 24      ; twenty-four zero bits: off
;
; Only mosi is wired; the LED has no clock and nothing to say back.
[spi2]
sck  = -1
mosi = 48
miso = -1
khz  = 2400
