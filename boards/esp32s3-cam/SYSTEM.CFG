; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by tools\mksysfs.py.  The running
; system rewrites the file whenever something has to be remembered - `drv
; install` adds a device line, `wifi connect` stores an SSID - so the two drift
; apart, and flashing this again is a deliberate reset to a known board rather
; than an update.
;
; A password is never written here by anything but the owner of the board.
;
; Flashing this file takes the Wi-Fi settings with it, and no committed file
; can bring them back: `wifi connect` writes the SSID and the password into
; the board's own copy, which is the only place a password belongs.  So after
; every `mksysfs --flash` the board is off the network until somebody types
; `wifi connect <ssid> <pass>` again.  It cost two round trips to notice, both
; of them looking like the network had gone wrong.
;
; REMDISP is this board's screen and there is no other: the S3 CAM has no
; panel and no pins left for one, so the picture leaves over UART1 to the CYD
; (docs\09-esp32-cyd.md).  It was installed by hand with `drv install` once and
; then lived only on the board's own flash, which meant reflashing C: silently
; took the screen away.  Written down here so that stops being possible.

[modules]
device = c:\drv\remdisp.sys

; ---------------------------------------------------------------------------
; AS ONE HALF OF A CLUSTER instead (worktree-cluster, until 25 Sep 2026): the
; [modules] above replaced by NODELINK alone, and the two sections below.
; Not both at once - REMDISP and NODELINK want the same UART1.
; ---------------------------------------------------------------------------
;  [modules]
;  ; The wire to the other board.  Nothing else: this board is being used as one
;  ; half of a cluster, and every driver that is not needed is a driver that can
;  ; be blamed for something.
;  device = c:\drv\nodelink.sys
;
;  ; ---------------------------------------------------------------------------
;  ; The cluster: which board this is, and which port the wire is on.
;  ;
;  ; The name is how the CYD refers to this one - in `ps`, in a device name, in
;  ; `run <name> <program>`.  Without it the board answers to node0, a number
;  ; meaning "the wire I am bound to", which says nothing about which board is at
;  ; the other end.
;  ;
;  ; uart 1 is the pin pair in BOARD.CFG that goes to the CYD (tx 42, rx 41; the
;  ; CYD answers on tx 22, rx 35, and its rx is input-only, which is why that end
;  ; is not a choice).  uart0 is the USB console and taking it would cost the only
;  ; way to talk to this board.
;  ;
;  ; 921600 is the driver's own default, written down rather than left implicit:
;  ; this pair of wires was measured clean to 5 Mbaud, so this is a long way under
;  ; what it holds.  Raise it after the link scenario is green, not before - a
;  ; wire too fast for the soldering looks exactly like a cluster losing messages.
;  ; ---------------------------------------------------------------------------
;  [cluster]
;  name = s3
;
;  [link]
;  uart = 1
;  baud = 921600

; how far the pointer goes for one count of the mouse, per cent (10..1000)
[mouse]
speed = 100
