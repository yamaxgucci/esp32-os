; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by tools\mksysfs.py.  The running
; system rewrites the file whenever something has to be remembered - `drv
; install` adds a device line, `wifi connect` stores an SSID - so the two drift
; apart, and flashing this again is a deliberate reset to a known board rather
; than an update.
;
; A password is never written here by anything but the owner of the board.
;
; Flashing this file takes the Wi-Fi settings with it, and no committed file
; can bring them back: `wifi connect` writes the SSID and the password into
; the board's own copy, which is the only place a password belongs.  So after
; every `mksysfs --flash` the board is off the network until somebody types
; `wifi connect <ssid> <pass>` again.  It cost two round trips to notice, both
; of them looking like the network had gone wrong.
;
; THE SCREEN IS ON THIS BOARD.  The S3 CAM has the ST7789 soldered to the CAM
; header - 320x240, SPI, backlight on the driver's own pin - and that panel is
; the console: the shell, the shop and every program that paints come up on the
; glass, and a USB keyboard in the host port types at it.  This section used to
; load REMDISP, with a comment saying the board had no panel; the panel was
; there the whole time, working under the KVM pack, and flashing C: here was
; what took it away.
;
; REMDISP instead, when this board is one half of a cluster and the picture
; leaves over UART1 to the CYD (docs\09-esp32-cyd.md): not both at once, they
; want the same UART1.  A board with its own glass never asks the neighbour for
; one.

[modules]
device = c:\drv\st7789s3.sys

[mouse]
speed = 100

; Programs live in a directory rather than on the bare drive: A:\APPS when a
; card is in the slot, C:\APPS when there is none.  Both are on PATH, so an
; installed program can be typed by its name - `ticker`, `edit'.  Without this
; line a program there is "Bad command or file name" from A:\>, because PATH is
; empty and only the current directory is searched.  Found on the board on
; 22 Oct 2026.
;
; The quotes are not decoration: ';' separates the directories AND starts a
; comment, so an unquoted value stops at the first one and only C:\APPS is
; searched - which looked exactly like "PATH does not work" until the second
; entry was tried.  cfg.c's clean_value() takes the quotes off.
[shell]
path = "C:\APPS;A:\APPS"


