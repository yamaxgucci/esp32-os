; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by tools\mksysfs.py.  The running
; system rewrites the file whenever something has to be remembered - `drv
; install` adds a device line, `wifi connect` stores an SSID - so the two drift
; apart, and flashing this again is a deliberate reset to a known board rather
; than an update.
;
; A password is never written here by anything but the owner of the board.
;
; Flashing this file takes the Wi-Fi settings with it, and no committed file
; can bring them back: `wifi connect` writes the SSID and the password into
; the board's own copy, which is the only place a password belongs.  So after
; every `mksysfs --flash` the board is off the network until somebody types
; `wifi connect <ssid> <pass>` again.  It cost two round trips to notice, both
; of them looking like the network had gone wrong.
;
; REMDISP is this board's screen and there is no other: the S3 CAM has no
; panel and no pins left for one, so the picture leaves over UART1 to the CYD
; (docs\09-esp32-cyd.md).  It was installed by hand with `drv install` once and
; then lived only on the board's own flash, which meant reflashing C: silently
; took the screen away.  Written down here so that stops being possible.

[modules]
device = c:\drv\remdisp.sys
