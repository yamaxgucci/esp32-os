; ArgonOS - what this board loads at boot, and the state it remembers.
;
; Flashed as part of C: by:
;
;   python tools\mksysfs.py --board boards\esp32s3-cam --flash -p COM<n>
;
; The running system rewrites this file whenever something has to be
; remembered - `drv install` adds a device line - so the flashed copy and the
; board's copy drift apart, and flashing it again is a deliberate reset to a
; known board rather than an update.

[modules]
; The wire to the other board.  Nothing else: this board is being used as one
; half of a cluster, and every driver that is not needed is a driver that can
; be blamed for something.
device = c:\drv\nodelink.sys

; ---------------------------------------------------------------------------
; The cluster: which board this is, and which port the wire is on.
;
; The name is how the CYD refers to this one - in `ps`, in a device name, in
; `run <name> <program>`.  Without it the board answers to node0, a number
; meaning "the wire I am bound to", which says nothing about which board is at
; the other end.
;
; uart 1 is the pin pair in BOARD.CFG that goes to the CYD (tx 42, rx 41; the
; CYD answers on tx 22, rx 35, and its rx is input-only, which is why that end
; is not a choice).  uart0 is the USB console and taking it would cost the only
; way to talk to this board.
;
; 921600 is the driver's own default, written down rather than left implicit:
; this pair of wires was measured clean to 5 Mbaud, so this is a long way under
; what it holds.  Raise it after the link scenario is green, not before - a
; wire too fast for the soldering looks exactly like a cluster losing messages.
; ---------------------------------------------------------------------------
[cluster]
name = s3

[link]
uart = 1
baud = 921600
