; ArgonOS USB-KVM dongle.  No [wifi] here: a fresh dongle has no network
; until the agent configures it (it writes /sys/KVMCFG.TXT and joins).

; Light up the soldered ST7789 panel at boot.  The driver turns the backlight
; on and mirrors the console - including KVM.AXE's "open http://<ip>/" line - to
; the glass, so the board can be read without a phone.  mksysfs stages the file
; (modules.txt); this is what tells the kernel to load it.
[modules]
device = c:\drv\st7789s3.sys
