; ArgonOS - ESP32-S3-WROOM CAM board as a USB-KVM dongle, with its soldered
; ST7789 panel.  Lives on the board's own flash as C:\BOARD.CFG and overrides
; the compiled-in defaults.  The camera is deliberately absent: its pins are the
; panel's now, so GC2145.SYS must never be loaded here.
[board]
name = esp32s3-cam
chip = esp32s3

; The panel's bus.  Clock 12 and data 11 are SPI2's IOMUX pins on the S3, so the
; panel skips the GPIO matrix.  No MISO: this panel cannot be read.  The control
; lines (CS 10, DC 13, RST 3, BL 46) are compiled into ST7789S3.SYS.
[spi2]
sck  = 12
mosi = 11
miso = -1
khz  = 80000

; The system framebuffer is soft; ST7789S3.SYS shows it on the glass, and
; KVM.AXE paints the dongle's address and state there so the board can be read
; without a phone.
[display]
driver = soft
width  = 320
height = 240
