; ArgonOS - AI-Thinker ESP32-A1S Audio Kit (the board marked V2.2).
;
; THIS FILE IS DELIBERATELY ALMOST EMPTY.  It says only enough to find out what
; the board is, and nothing that would pretend to know.
;
;   python tools\boardtest.py -p COM<n> --put "boards\esp32-a1s\BOARD.CFG=c:\BOARD.CFG"
;   (reboot, then)  io i2c 0
;
; WHY THERE ARE NO AUDIO PINS HERE YET
;
; AI-Thinker shipped at least seven boards under the one marking "V2.2", with
; two different codecs and pin maps that do not agree - the number after the
; version is what distinguishes them, and the ones that are documented are
; V2.2 3478 (ES8388) and V2.2 2762 (AC101).  Ours says A404, which matches
; neither list, and the codec is inside the shielded module where nobody can
; read it.  A wrong pin here is the expensive kind of mistake: everything
; reports healthy and the board is silent, which is an afternoon.
;
; So the codec is identified by asking the bus instead, which costs nothing and
; cannot be wrong:
;
;   0x10 or 0x11 answers  ->  ES8388, and it must be programmed over I2C
;   0x1a answers          ->  AC101, a different chip with different pins
;   nothing answers       ->  the two pins below are wrong; try another pair
;
; A scan only reads, so guessing these two is free in a way that guessing the
; I2S pins is not.

[board]
name = esp32-a1s

; ---------------------------------------------------------------------------
; The control bus to the codec.  33/32 is the pair the ESP32-A1S board
; definitions in the wild use; it is a starting point for the scan above and
; nothing more.  If `io i2c 0` finds nothing, this pair is the first thing to
; change - not the last.
; ---------------------------------------------------------------------------
[i2c0]
sda = 33
scl = 32

; ---------------------------------------------------------------------------
; [audio] is left out on purpose.  It goes in once the scan has named the
; codec, together with its I2S pins and the register setup it needs - both
; codecs come up muted, so wiring alone will not make a sound.
;
; The guitar also needs a buffer in front of the line input before any of this
; is worth listening to: a pickup is a high-impedance source and the codec's
; input is 10-20 kOhm, so without one the signal sags and the top end goes.
; Five parts; docs/10-watch-board.md has the circuit.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; There is no screen on this board, and saying so is not a detail.  With no
; BOARD.CFG at all the system reaches for the QEMU panel, fails on real
; hardware, then tries a 640x400 soft framebuffer - half a megabyte on a
; machine with 169 KB - and the whole devices stage fails with -12, taking the
; rest of the stage's devices down with it.  `none` is no graphics whatsoever,
; which is the truth here and costs nothing.
; ---------------------------------------------------------------------------
[display]
driver = none

; ---------------------------------------------------------------------------
; The codec, now that the bus has named it.
;
;   (1) C:\> io i2c 0
;   i2c0 up on sda=33 scl=32 at 100 kHz
;     0x10 answers
;
; 0x10 is an ES8388, which settles which of the seven "V2.2" boards this is:
; the documented ES8388 map.  That the codec answered on exactly the 33/32 this
; file guessed is the corroboration - the pins below come from the same map as
; the pair that just worked, not from a different source that happens to agree.
;
; din is GPIO35, which is input-only on this chip.  That is not a limitation
; here: it is the line the codec sends on and nothing else ever drives it.
;
; The speaker amplifier (NS4150C) is held off by GPIO21 and there is no board
; key for it, so it is raised by hand for now:  io 21 out  /  io 21 1
;
; NONE OF THIS MAKES A SOUND BY ITSELF.  An ES8388 powers up muted with its
; converters unclocked; it has to be programmed over the bus above before the
; first frame is worth sending.  Pins are necessary and not sufficient.
; ---------------------------------------------------------------------------
[audio]
mclk = 0
bclk = 27
ws   = 25
dout = 26
din  = 35
rate = 44100

; The bus above is also how the codec is woken - see codec_es8388.c.  Without
; this line the pins are clocked and the ES8388 stays muted.
i2c  = 0

; ---------------------------------------------------------------------------
; What is plugged into the input jack, stated as gain rather than guessed.
;
; The codec is on its line input, which expects about a volt.  A guitar pickup
; gives a tenth of that, so without help it arrives near the noise floor and
; the amplifier has nothing to model.  24 dB is the codec preamplifier at full
; and the right starting point for a pickup straight in; drop it in 3 dB steps
; if the level shown by STOMP sits at the top, and set it to 0 for anything
; with a line output.
;
; This is not a substitute for the buffer in docs/10-watch-board.md: a pickup
; is a high-impedance source and the input is 10-20 kOhm, so the top end goes
; whatever the gain is.  It is what makes the guitar audible before the buffer
; is built.
;
; ZERO, after reading the board's own history.  This input is not the AC101's:
; the line pins are much more sensitive and are reported to distort easily, and
; 24 dB was chosen here from the level a pickup gives rather than from what this
; jack wants.  Raise it in 3 dB steps only if the guitar proves too quiet.
;
; AND THE MICROPHONE CANNOT BE SWITCHED OFF.  On this board LINEIN L/R are
; wired to LIN2/RIN2, which are also MIC2's pins, so the second microphone is
; in the signal whatever this driver selects; it is a fault of the board and
; not of the codec.  It arrives inverted on the right channel, so STOMP's
; `inmix` adds the two channels and it cancels.  The repair with a soldering
; iron is to lift C19 and C20.
; ---------------------------------------------------------------------------
ingain = 0
