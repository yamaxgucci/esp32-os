; ArgonOS - AI-Thinker ESP32-A1S Audio Kit (the board marked V2.2).
;
; THIS FILE IS DELIBERATELY ALMOST EMPTY.  It says only enough to find out what
; the board is, and nothing that would pretend to know.
;
;   python tools\boardtest.py -p COM<n> --put "boards\esp32-a1s\BOARD.CFG=c:\BOARD.CFG"
;   (reboot, then)  io i2c 0
;
; WHY THERE ARE NO AUDIO PINS HERE YET
;
; AI-Thinker shipped at least seven boards under the one marking "V2.2", with
; two different codecs and pin maps that do not agree - the number after the
; version is what distinguishes them, and the ones that are documented are
; V2.2 3478 (ES8388) and V2.2 2762 (AC101).  Ours says A404, which matches
; neither list, and the codec is inside the shielded module where nobody can
; read it.  A wrong pin here is the expensive kind of mistake: everything
; reports healthy and the board is silent, which is an afternoon.
;
; So the codec is identified by asking the bus instead, which costs nothing and
; cannot be wrong:
;
;   0x10 or 0x11 answers  ->  ES8388, and it must be programmed over I2C
;   0x1a answers          ->  AC101, a different chip with different pins
;   nothing answers       ->  the two pins below are wrong; try another pair
;
; A scan only reads, so guessing these two is free in a way that guessing the
; I2S pins is not.

[board]
name = esp32-a1s

; ---------------------------------------------------------------------------
; The control bus to the codec.  33/32 is the pair the ESP32-A1S board
; definitions in the wild use; it is a starting point for the scan above and
; nothing more.  If `io i2c 0` finds nothing, this pair is the first thing to
; change - not the last.
; ---------------------------------------------------------------------------
[i2c0]
sda = 33
scl = 32

; ---------------------------------------------------------------------------
; [audio] is left out on purpose.  It goes in once the scan has named the
; codec, together with its I2S pins and the register setup it needs - both
; codecs come up muted, so wiring alone will not make a sound.
;
; The guitar also needs a buffer in front of the line input before any of this
; is worth listening to: a pickup is a high-impedance source and the codec's
; input is 10-20 kOhm, so without one the signal sags and the top end goes.
; Five parts; docs/10-watch-board.md has the circuit.
; ---------------------------------------------------------------------------
