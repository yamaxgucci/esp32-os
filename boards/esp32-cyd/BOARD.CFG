; ArgonOS - ESP32-2432S024, the 2.4" "cheap yellow display" board.
;
; Copy this onto the board's own flash as C:\BOARD.CFG.  It cannot be read from
; the SD card: these are the pins the system needs in order to reach the card
; in the first place.  From a development machine:
;
;   python tools\boardtest.py -p COM3 --put "boards\esp32-cyd\BOARD.CFG=c:\board.cfg"
;
; On the board itself:  edit c:\board.cfg
;
; CAUTION: these numbers are this board.  The family is sold as several models
; whose pins differ - the 2.8" has its backlight on 21 where this has 27 - and
; a wrong SD chip select is a card that never mounts while everything else
; looks healthy.

[board]
name = esp32-cyd

; ---------------------------------------------------------------------------
; SD card - drive A:.  On the SPI bus, not SDMMC: only one data line is wired.
; SPI3 is the chip's VSPI, which on this board goes nowhere else.
; ---------------------------------------------------------------------------
[sd]
interface = spi
spi_host  = 3
sck       = 18
mosi      = 23
miso      = 19
cs        = 5
max_khz   = 20000

; ---------------------------------------------------------------------------
; Display - ILI9341, 320x240 landscape, on SPI2 (HSPI).
;
; Two different things, and they share nothing but the glass:
;
;   The console arrives at the panel as characters - c:\drv\ili9341.sys turns
;   one row of cells at a time into pixels, with a five kilobyte buffer and no
;   framebuffer anywhere.  That is what BOARD.CFG cannot switch off and what
;   is on the screen at the prompt.
;
;   The soft framebuffer below is what *applications* draw into, and its size
;   is a memory decision, not a screen one: 320x240 in RGB565 is 150 KB and
;   the largest block this board can hand out is about sixty.  160x120 is
;   37 KB, and the driver puts it on the glass at exactly two-to-one - the
;   whole screen, no margins, no resampling.
;
; Backlight is GPIO 27 (21 on the 2.8" board), active high.  MISO is GPIO 12,
; which is also the strapping pin that selects the flash voltage: anything
; holding it high through reset stops the board booting at all.
; ---------------------------------------------------------------------------
[display]
driver = soft
width  = 160
height = 120

[spi2]
sck  = 14
mosi = 13
miso = 12
khz  = 40000

; ---------------------------------------------------------------------------
; Touch: XPT2046, on the *display's* bus with a chip select of its own (33).
;
; There is nothing to configure here - the driver knows the chip select and
; asks for its own clock (2 MHz; the panel runs the same wires at 40) - but it
; is worth writing down, because every description of this board family says
; the touch controller has four pins of its own, 25/32/39/33.  That is the 2.8
; inch model.  On this one those pins read zeros forever, and the controller
; answers on 14/13/12 with CS 33.  Found with main/probe.c, which runs instead
; of the system.
;
;   pen down (IRQ)  GPIO 36, active low, external pull-up
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; The rest of the board, read off the silkscreen and the parts themselves.
;
;   sound           GPIO 26 (DAC channel 2) -> LTK8002D mono amplifier ->
;                   the two pin white connector marked SPEAK at the right edge.
;                   The amplifier is fitted; the SPEAK connector ships EMPTY.
;                   No speaker, no sound, and nothing in software can tell -
;                   /dev/pcm0 comes up and plays into the amplifier either way.
;                   Any small 8 ohm speaker, or an earphone, either polarity.
;   RGB LED         red 4, green 16, blue 17 - all active LOW
;   light sensor    GPIO 34 = ADC1 channel 6  ->  io adc 6
;   battery         BAT connector + FM6324H charger and a 2R2 inductor: this
;                   board can run off a cell, cable unplugged.
;   USB             CH340C bridge only.  There is no USB on the chip.
;   headers         P1 top (+5V TX RX GND), P3 bottom (IO21 IO22 IO27 IO35)
;
; Do not configure GPIO 6..11: they are the flash lines inside the module.
; The system refuses them, which is the point of the pin table.
; ---------------------------------------------------------------------------
