; ArgonOS - ESP32-2432S024, the 2.4" "cheap yellow display" board.
;
; Copy this onto the board's own flash as C:\BOARD.CFG.  It cannot be read from
; the SD card: these are the pins the system needs in order to reach the card
; in the first place.  From a development machine:
;
;   python tools\boardtest.py -p COM3 --put "boards\esp32-cyd\BOARD.CFG=c:\board.cfg"
;
; On the board itself:  edit c:\board.cfg
;
; CAUTION: these numbers are this board.  The family is sold as several models
; whose pins differ - the 2.8" has its backlight on 21 where this has 27 - and
; a wrong SD chip select is a card that never mounts while everything else
; looks healthy.

[board]
name = esp32-cyd
; The chip, so that a C: image cannot be laid out for the wrong board.
; The partition tables differ between them - where C: starts and how
; big it is - and an image built against the wrong one lands at the
; wrong offset or takes half the room it should.  Both mount.  Both
; work.  One of them runs out of space months later.
chip = esp32

; ---------------------------------------------------------------------------
; SD card - drive A:.  On the SPI bus, not SDMMC: only one data line is wired.
; SPI3 is the chip's VSPI, which on this board goes nowhere else.
; ---------------------------------------------------------------------------
[sd]
interface = spi
spi_host  = 3
sck       = 18
mosi      = 23
miso      = 19
cs        = 5
max_khz   = 20000

; ---------------------------------------------------------------------------
; Display - ILI9341, 320x240 landscape, on SPI2 (HSPI).
;
; Two different things, and they share nothing but the glass:
;
;   The console arrives at the panel as characters - c:\drv\ili9341.sys turns
;   one row of cells at a time into pixels, with a five kilobyte buffer and no
;   framebuffer anywhere.  That is what BOARD.CFG cannot switch off and what
;   is on the screen at the prompt.
;
;   The soft framebuffer below is what *applications* draw into, and its size
;   is a memory decision, not a screen one: 320x240 in RGB565 is 150 KB and
;   the largest block this board can hand out is about sixty.  160x120 is
;   37 KB, and the driver puts it on the glass at exactly two-to-one - the
;   whole screen, no margins, no resampling.
;
; Backlight is GPIO 27 (21 on the 2.8" board), active high.  MISO is GPIO 12,
; which is also the strapping pin that selects the flash voltage: anything
; holding it high through reset stops the board booting at all.
; ---------------------------------------------------------------------------
[display]
driver = soft
width  = 160
height = 120

[spi2]
sck  = 14
mosi = 13
miso = 12
; The default for a device that does not name its own speed.  Both devices on
; these wires do name it now - the panel 40 MHz, the touch 2 - and that is the
; point of the line below being what it is: it was eighty, the panel silently
; inherited it, and eighty megahertz down traces that also carry a touch
; controller put single wrong pixels all over the picture while a stylus was
; moving.  Nothing reported an error, because SPI does not check what it
; carried.
khz  = 80000

; ---------------------------------------------------------------------------
; UART1 - the wire to the board this one is a screen for.
;
; The three free pins are IO35, IO22 and IO21, and IO35 is input-only, so it
; can only ever receive: the picture arrives there.  The answer goes out on
; IO21, not IO22 - IO22 carried it faultlessly at eight megabaud in the morning
; and by the evening carried nothing at all, at any speed, while levels still
; cross that wire in both directions and both ends still work as ordinary GPIO.
; Unexplained, and left that way because IO21 does the job: 4 MB at eight
; megabaud with no error.  IO22 is the spare, and the good one to have spare,
; since it can drive - so that wire can carry a handshake, which IO35 cannot.
;
; IO35 was under suspicion for a day.  Measured 4 September 2026 with `link`,
; 16 MB at 8 Mbaud: arriving at IO35, 779 corrupt blocks and five per cent of
; the picture lost; leaving IO22 for the S3, nothing lost at all.  But moving
; the picture to IO22 changed nothing - 735 306 useful bytes a second against
; 735 649 - so the asymmetry is not the pin.  It is this chip: the ESP32
; receives four megabaud perfectly and loses about a twentieth of every block
; above it, while the S3 at the other end takes eight without an error.
; ---------------------------------------------------------------------------
; ON THIS UNIT, AGAIN IO22 (25 Sep 2026).  The IO21 above was the S3-CAM
; pairing; the CYD in the cluster is wired C3 GPIO 3 <- IO22, and IO21 is not
; connected at all here - Maxim, looking at the board.  The merge with main
; brought tx = 21 back and the C3 heard nothing from this board: 118 frames
; sent, almost 4000 sent again, none received.  If the IO22 fault ever comes
; back, move the wire to IO21 and this line with it.
[uart1]
tx   = 22
rx   = 35
baud = 115200

; ---------------------------------------------------------------------------
; Touch: XPT2046, on the *display's* bus with a chip select of its own (33).
;
; There is nothing to configure here - the driver knows the chip select and
; asks for its own clock (2 MHz; the panel runs the same wires at 40) - but it
; is worth writing down, because every description of this board family says
; the touch controller has four pins of its own, 25/32/39/33.  That is the 2.8
; inch model.  On this one those pins read zeros forever, and the controller
; answers on 14/13/12 with CS 33.  Found with main/probe.c, which runs instead
; of the system.
;
;   pen down (IRQ)  GPIO 36, active low, external pull-up
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; The rest of the board, read off the silkscreen and the parts themselves.
;
;   sound           GPIO 26 (DAC channel 2) -> LTK8002D mono amplifier ->
;                   the two pin white connector marked SPEAK at the right edge.
;                   The amplifier is fitted; the SPEAK connector ships EMPTY.
;                   No speaker, no sound, and nothing in software can tell -
;                   /dev/pcm0 comes up and plays into the amplifier either way.
;                   Any small 8 ohm speaker, or an earphone, either polarity.
;   RGB LED         red 4, green 16, blue 17 - all active LOW
;   light sensor    GPIO 34 = ADC1 channel 6  ->  io adc 6
;   battery         BAT connector + FM6324H charger and a 2R2 inductor: this
;                   board can run off a cell, cable unplugged.
;   USB             CH340C bridge only.  There is no USB on the chip.
;   SD card         a reset does not power-cycle it.  Many quick resets while it
;                   is being read leave it deaf until the USB is unplugged;
;                   sdmmc_card_init failed (0x107) at every boot is that, and
;                   not a wiring or a speed problem.
;   headers         three four-way connectors, read off the board:
;                     P1   +5V  TX   RX   GND     (TX/RX are GPIO 1 and 3,
;                                                  the console through the CH340)
;                     P3   GND  IO35 IO22 IO21
;                     CN1  GND  IO22 IO21 3.3V
;                   So the free pins are three, not four, and two of them
;                   appear twice: 21, 22 and 35 - and 35 is input-only.
;                   GPIO 27 is NOT on a connector: it is the backlight and
;                   nothing else.  Three pins is a serial link and its
;                   handshake; it is one short of an SPI slave, which is
;                   why a second board on this one's wires talks UART.
;
; Do not configure GPIO 6..11: they are the flash lines inside the module.
; The system refuses them, which is the point of the pin table.
; ---------------------------------------------------------------------------
