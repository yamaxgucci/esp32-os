; ArgonOS - ESP32-2432S028R, the "cheap yellow display" board.
;
; Copy this onto the board's own flash as C:\BOARD.CFG.  It cannot be read
; from the SD card: these are the pins the system needs in order to reach the
; card in the first place.  Until it exists the defaults apply, and the
; defaults are the original ESP32 SDMMC slot - four of whose pins are wired to
; the display here, so the card will not be found.
;
; Type it with the built-in editor:  edit c:\board.cfg
;
; CAUTION: the pin numbers below are the common revision.  This board has been
; sold in several, and a wrong SD chip select is a card that never mounts while
; everything else looks healthy.  Check yours against the silkscreen.

[board]
name = esp32-cyd

; ---------------------------------------------------------------------------
; SD card - drive A:.  On the SPI bus, not SDMMC: only one data line is wired.
; SPI3 is the chip's VSPI, which on this board goes nowhere else.
; ---------------------------------------------------------------------------
[sd]
interface = spi
spi_host  = 3
sck       = 18
mosi      = 23
miso      = 19
cs        = 5
max_khz   = 20000

; ---------------------------------------------------------------------------
; Display - ILI9341, 320x240, on SPI2 (HSPI).  `none` until the panel driver
; exists: the default soft framebuffer is 640x400 RGB565, which is 512 KB, and
; this board has 320 KB of RAM in total and no PSRAM.  When the driver lands,
; set driver = ili9341 and the size below; one 320x240 buffer is 150 KB, so
; expect to run single-buffered.
;
; Backlight is GPIO 21, active high - dark screen at boot is that pin, not the
; panel.  MISO is GPIO 12, which is also the strapping pin that selects the
; flash voltage: anything holding it high through reset stops the board from
; booting at all.
; ---------------------------------------------------------------------------
[display]
driver = none
width  = 320
height = 240

[spi2]
sck  = 14
mosi = 13
miso = 12
khz  = 40000

; ---------------------------------------------------------------------------
; The rest of the board, for reference - nothing claims these yet.
;
;   touch XPT2046   clk 25, mosi 32, miso 39, cs 33, irq 36
;   speaker         GPIO 26 through a small amplifier (DAC channel 2)
;   RGB LED         red 4, green 16, blue 17 - all active LOW
;   light sensor    GPIO 34 = ADC1 channel 6  ->  io adc 6
;   free header P3  GPIO 35 (input only), 22, 21 - and 21 is the backlight
;
; Do not configure GPIO 6..11: they are the flash lines inside the module.
; The system refuses them, which is the point of the pin table.
; ---------------------------------------------------------------------------
