; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by `argon sysfs -p COM3`.  The
; running system rewrites the file whenever something has to be remembered -
; `drv install` adds a device line, `wifi connect` stores an SSID - so the two
; drift apart, and flashing this again is a deliberate reset to a known board
; rather than an update.
;
; A password is never written here by anything but the owner of the board.

[modules]
device = c:\drv\ili9341.sys
device = c:\drv\xpt2046.sys
