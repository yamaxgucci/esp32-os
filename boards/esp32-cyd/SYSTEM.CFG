; ArgonOS - what this board loads at boot, and the state it remembers.
;
; This copy is the one flashed as part of C: by `argon sysfs -p COM3`.  The
; running system rewrites the file whenever something has to be remembered -
; `drv install` adds a device line, `wifi connect` stores an SSID - so the two
; drift apart, and flashing this again is a deliberate reset to a known board
; rather than an update.
;
; A password is never written here by anything but the owner of the board.

[modules]
device = c:\drv\ili9341.sys
device = c:\drv\xpt2046.sys
; The wire to the other board.  Built for an LX6 - see modules.txt in this
; directory for why the name differs from the S3's.
device = c:\drv\nodeln32.sys

; ---------------------------------------------------------------------------
; The cluster: which board this is, and which port the wire is on.
;
; The name is how the other board refers to this one - in `ps`, in a device
; name, in `run <name> <program>`.  Without it this board answers to node0,
; which is a number meaning "the wire I am bound to" and says nothing about
; which board is at the other end of it.
;
; uart is 1 because [uart1] in BOARD.CFG is the pin pair that goes to the other
; board.  uart0 is the console through the CH340, and taking that would cost
; the only way to talk to this board at all.
;
; baud is the driver's own default, written down rather than left implicit.
; This pair of wires was measured clean to 5 Mbaud, so 921600 is a long way
; under what it holds, on purpose.  Raise it after the link scenario is green,
; not before: a wire too fast for the soldering looks exactly like a cluster
; that loses messages.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; No soft framebuffer on this board while it is a cluster node.
;
; BOARD.CFG asks for 160x120, which is 37 KB of RGB565 reserved for whatever an
; application draws into.  That is the right answer for a board running a game
; and the wrong one here: a node has 203 KB of internal SRAM in total, the
; system holds 196 of it once the panel, the touch and the wire are loaded, and
; `link` was refused its 16 KB task stack with 7 KB free.
;
; `panel` keeps the glass - the console is characters, turned into pixels a row
; at a time by c:\drv\ili9341.sys, and never goes through a framebuffer.  What
; is given up is only what LOCAL applications draw.
;
; Put `soft` back for a board that has to draw locally, and expect the memory
; back out of something else.
; ---------------------------------------------------------------------------
[display]
driver = panel

; This board is half of a cluster, and says so here rather than in a batch
; file.  `multiboard = none` is a board refusing to be part of one at all: it
; binds no wire, and with no wire bound nothing can be asked of it - no remote
; run, no guest process, no reading of this card, no borrowing of these
; devices.  There is no Master and no Slave, because the role is per request:
; this board is the screen for its neighbour's compute and the one asking for
; work back when it wakes, in the same afternoon.
[cluster]
name = cyd
multiboard = yes
; Hand the work to the neighbour after this many seconds with nothing above
; standby_busy per mille of a core, and fetch it back when work returns.
;
; OFF on this board, and the zero is a decision rather than a default left
; alone.  It was verified here at 10 seconds - MIGRANT counted to 23, the
; watcher moved it to the C3, and it carried on from 23 with nobody typing
; anything - but a board that gives its work away after ten quiet seconds is
; not what anyone wants from the machine with the screen on it.  Turn it on
; for the board that is meant to sleep, in minutes rather than seconds.
standby_after = 0

[link]
uart = 1
; 8 Mbaud (26 Sep 2026), measured with `link flood`, 1 KB frames:
;
;   baud   C3 -> CYD     CYD -> C3
;   4 M    373 KB/s      378 KB/s
;   8 M    749 KB/s      755 KB/s    no frame sent twice
;   16 M   1320 KB/s     262 KB/s
;
; Before that day 5 Mbaud was the most the CYD would take, and it was the
; receive FIFO, not the ESP32: the driver was woken at 120 bytes of 128, and
; the last eight arrive in 5 us at 16 Mbaud (see uart_hw.c).  Not 16: the
; way back is slow there because the C3 turns received bits while it sends
; its own acknowledgements (the [link2] note, the same on the Zero's wire),
; and what comes back from the CYD includes the "pass painted" answers the
; picture waits for - at 16 the square froze after fourteen seconds, every
; time, and at 8 it did not.
baud = 8000000
; Received by the ESP32's own UHCI (29 Sep 2026): IDF has no driver for it on
; this chip, and through the driver's interrupt the CYD took some 300 KB/s at
; 62% of a core - a full-screen picture at 1.2 frames a second.  A ring of
; 1 KB descriptors the DMA goes round (uartdma_hw.c); what goes out still
; goes through the driver.  `auto` (1 Oct 2026, the same line on every
; board): the chip says which way it does by DMA - here the receive only.
; `no` puts the driver's receive back, for measuring.
dma = auto
; 1 KB frames: a link costs about nine frames of this board's scarce
; internal memory.
frame = 1024
; Bind at boot, by name - `auto` would do on a board with one link device and
; is the right answer for anyone who has not counted theirs.
bind = node0

; No system framebuffer on this board, and it is not a preference.
;
; BOARD.CFG asks for a 160x120 soft surface, which is 37 KB of a machine that
; has 179 - and the things this board is actually for bring their own pixels
; through gfx->present: REMTERM, the Marauder port, the graphics demos.  With
; the surface in place there was 23 KB free with the radio up, which is not
; enough to start the file server, and this line is what got it back.
;
; It lived only on the board until now, put there by hand, so flashing C:
; silently took it away - the same trap the S3's board pack was given a note
; about.  See docs/09-esp32-cyd.md.
[display]
driver = panel
; The console's grid is the unit a touch driver reports in, so on a board with
; a touchscreen it has to be the panel's own: 320x240 of 8x8 is forty by
; thirty.  Left at the firmware's forty by twenty-five, the kernel turned each
; reported row back into nine pixels instead of eight and the pointer sat
; below the stylus - and the bottom forty pixels of glass could not be touched
; at all, because a row past the twenty-fourth was clamped onto it.
[console]
cols = auto
rows = auto
