; ArgonOS - M5Stack Stamp-P4 (S013).
;
; Flashed as part of C: by:
;
;   python tools\mksysfs.py --board boards\m5stack-stamp-p4 --flash -p COM<n>
;
; The part is an ESP32-P4NRW32, revision v1.3: two RISC-V cores at 360 MHz,
; 768 KB of L2 memory, 32 MB of HEX PSRAM in the package, 16 MB of flash.
; No radio - Wi-Fi on this board is the Stamp-AddOn C6 on the SDIO connector,
; which is not fitted here.
;
; The USB-C socket goes to the chip's own USB-Serial/JTAG on GPIO 24 and 25 (it
; enumerates as 303A:1001, like the C6), so the console is that device.  There
; is no bridge chip, and a reset does not drop the port.

[board]
name = m5stack-stamp-p4
; The chip, so that a C: image cannot be laid out for the wrong board.
chip = esp32p4

; ---------------------------------------------------------------------------
; Nothing else is on the stamp itself.  No glass, no card slot, no codec, no
; button and no LED that M5Stack's own library knows of (M5Unified detects the
; board and configures nothing for it).  What the board has is 44 GPIOs on its
; castellated holes - G0..G39, G41, G49, G50, G52 - plus MIPI-DSI, MIPI-CSI and
; the OTG HS pair, and all of that belongs to whatever carrier it is soldered
; to.  Describe the carrier's devices here when there is one.
;
; Pins the system will refuse whatever this file says (io_hw.c):
;
;   24, 25    USB-Serial/JTAG - the console.
;
; Strapping pins, sampled at reset and to be left alone at that moment:
; 34, 35 (35 low = download mode), 36, 37, 38.  37/38 are also UART0, where
; the ROM prints its banner.
; ---------------------------------------------------------------------------
[display]
driver = none

[sd]
interface = none
