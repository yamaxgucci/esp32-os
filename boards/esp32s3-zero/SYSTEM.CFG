; ArgonOS - the third board of the cluster, and a leaf of it.
;
; One wire, to the C3, which is the middle.  The middle is the C3 and not this
; board because of what the other two have left rather than what they are good
; at: the CYD has one free pin after its own wire and a second wire needs two,
; and putting the middle here would mean unsoldering the CYD-C3 pair - the pair
; that has been proved on hardware.  The C3 had one UART spare, which is
; exactly enough.
;
; There is no Master and no Slave in this system.  Being a leaf costs this
; board nothing except that a message from here to the CYD passes through the
; C3, and that path does not exist yet - see docs/plans/cluster.md.

; NODELINK.SYS is the S3's own build - NODELN32 is the CYD's (LX6) and
; NODELNRV is the C3's.  The wrong one loads and then throws an illegal
; instruction somewhere inside, rather than refusing.
[modules]
device = c:\drv\nodelink.sys

; ---------------------------------------------------------------------------
; The wire: uart1, the pin pair in BOARD.CFG (tx 7, rx 8), to the C3.
;
; 921600 is the driver's default written down rather than left implicit.  It is
; a NEW pair of wires and nothing has been measured on it; the 5 Mbaud measured
; on the S3-to-CYD pair says nothing about this one.  Run `link` alone first
; and raise it only on evidence.
; ---------------------------------------------------------------------------
[link]
uart = 1
baud = 921600

; Every link device this board has, which is what `auto` means.
bind = auto

[cluster]
name = zero
multiboard = yes

; ---------------------------------------------------------------------------
; This board has no screen and no card of its own, so it is a plausible place
; to leave work while a bigger board sleeps.  Off for now all the same: nothing
; about standby has been run on three boards, and a board that hands its work
; away on a timer is the wrong thing to be debugging a new wire through.
; ---------------------------------------------------------------------------
standby_after = 0
