; ArgonOS - the third board of the cluster, and a leaf of it.
;
; One wire, to the C3, which is the middle.  The middle is the C3 and not this
; board because of what the other two have left rather than what they are good
; at: the CYD has one free pin after its own wire and a second wire needs two,
; and putting the middle here would mean unsoldering the CYD-C3 pair - the pair
; that has been proved on hardware.  The C3 had one UART spare, which is
; exactly enough.
;
; There is no Master and no Slave in this system.  Being a leaf costs this
; board nothing except that a message from here to the CYD passes through the
; C3, and that path does not exist yet - see docs/plans/cluster.md.

; NODELINK.SYS is the S3's own build - NODELN32 is the CYD's (LX6) and
; NODELNRV is the C3's.  The wrong one loads and then throws an illegal
; instruction somewhere inside, rather than refusing.
[modules]
device = c:\drv\nodelink.sys

; ---------------------------------------------------------------------------
; The wire: uart1, the pin pair in BOARD.CFG (tx 7, rx 8), to the C3.
;
; 921600 is the driver's default written down rather than left implicit.  It is
; a NEW pair of wires and nothing has been measured on it; the 5 Mbaud measured
; on the S3-to-CYD pair says nothing about this one.  Run `link` alone first
; and raise it only on evidence.
; ---------------------------------------------------------------------------
[link]
uart = 1
; 460800, matching the other end of this wire, and for a measured reason: at
; 921600 this wire gave 36 bad frames and 597 gaps over a 19 KB file against 6
; and 54 at 460800.  It used to be overridden at runtime in c:\system.cfg, which
; a reflash of C: wipes - so it belongs in the pack, where the C3's [link2]
; already says the same thing about the same copper.
baud = 460800

; Every link device this board has, which is what `auto` means.
bind = auto

; ---------------------------------------------------------------------------
; THE FAST LINK, BESIDE THE UART RATHER THAN INSTEAD OF IT.
;
; Two transports on one pair of boards is the only way to measure one against
; the other honestly: a number taken on the UART on Wednesday and on SPI on
; Friday compares Wednesday with Friday, not UART with SPI.  So the wire to the
; C3 keeps node0 and this one is node1, which is what `link use node1` switches
; to.  Nothing above the wire knows which of the two it is talking over.
;
; role = master, because this is the end whose pads are SPI2's native ones and
; because that is the configuration measured clean at 40 MHz.  The role is a
; line in a configuration file, not a different build: both ends run the same
; image.
; ---------------------------------------------------------------------------
[linkspi]
role = master
bus  = 2
cs   = 10
khz  = 20000
dev  = node1
; TRIAL A ANSWER, 22 Sep, on the code before the block-discipline fixes: the
; gap is NOT what caps the master's block rate.  At gap_us = 0 the master clocked
; 610 blocks/s over a known idle 20 s (bytes 873472 -> 7118848 = 12198 blocks)
; and 641 blocks/s through a 6791-byte `link get`, against 560 blocks/s measured
; at gap_us = 100 - and the 100 us gap alone would allow 3279/s.  Losses were
; far worse at 0 (453 gaps / 98 dups / 640 bad on 6791 B).  So the rate limiter
; was the caller's pumping loop, not block_gap().  Left at the driver's default
; for the re-measure; see build/cluster-stash/run06-console.log.
gap_us = 600

[cluster]
name = zero
multiboard = yes

; ---------------------------------------------------------------------------
; This board has no screen and no card of its own, so it is a plausible place
; to leave work while a bigger board sleeps.  Off for now all the same: nothing
; about standby has been run on three boards, and a board that hands its work
; away on a timer is the wrong thing to be debugging a new wire through.
; ---------------------------------------------------------------------------
standby_after = 0
