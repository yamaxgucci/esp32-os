; ArgonOS - the middle of a three-board cluster.
;
; This board holds a wire to each of the others.  It is the middle because of
; the pins, not because of the work: the CYD has one free pin left after its
; own wire and cannot take a second (see BOARD.CFG here, and the CYD's).
;
; There is no Master and no Slave in this system, and holding two wires does
; not make this board in charge of anything - the role belongs to whoever is
; asking.  What it does mean is that a message between the CYD and the C3 has
; to pass through here, which is the one thing a star costs.

; NODELINK.SYS is the S3's own build - NODELN32 is the CYD's (LX6) and
; NODELNRV is the C3's.  The wrong one loads and then throws an illegal
; instruction somewhere inside, rather than refusing.
[modules]
device = c:\drv\nodelink.sys

; ---------------------------------------------------------------------------
; The two wires.  `[link]` is the first for the same reason every other board
; spells it that way; `[link2]` exists only here.
;
;   link   uart1 -> the CYD    (its screen, its card, its converter)
;   link2  uart2 -> the C3     (a core, and nothing else)
; ---------------------------------------------------------------------------
[link]
uart = 1
baud = 921600

[link2]
uart = 2
baud = 921600

; Every link device this board has, which is what `auto` means: naming them
; one by one would be a list that goes stale the first time a board is added.
bind = auto

[cluster]
name = s3
multiboard = yes

; ---------------------------------------------------------------------------
; This board has no screen and no card of its own, so it is a plausible place
; to leave work while a bigger board sleeps - but standby is off here, because
; the middle of a star is the one board whose absence stops the others talking
; to each other.
; ---------------------------------------------------------------------------
standby_after = 0
