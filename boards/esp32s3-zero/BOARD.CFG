; ArgonOS - Waveshare ESP32-S3-Zero with a CS4344 (CJMCU-4344) I2S DAC.
;
; Copy it onto the board's own flash as C:\BOARD.CFG - there is no card on this
; machine, and these are the pins the system needs before it can reach anything:
;
;   python tools\boardtest.py -p COM6 --put "boards\esp32s3-zero\BOARD.CFG=c:\BOARD.CFG"
;
; Pins per the working AcidBox config.  The CS4344 needs a precise master clock,
; and the kernel switches the I2S to the APLL when audio.mclk is set.

[board]
name = esp32s3-zero

; ---------------------------------------------------------------------------
; No panel is wired to this board, and the soft framebuffer is kept anyway.
;
; `driver = none` would be the honest description of the hardware and the wrong
; setting for what this board is for: STOMP draws into the surface and nobody
; sees it, so the processor pays exactly what it would pay behind a screen.  A
; measurement taken with the drawing switched off is a measurement of a
; different program.
;
; 320x240 is a pedal's screen rather than the 640x400 default, and it comes out
; of PSRAM (ag_port_alloc asks for slow memory first), so the 186 KB of internal
; RAM the system lives in is untouched.
; ---------------------------------------------------------------------------
[display]
driver = soft
width  = 320
height = 240

; ---------------------------------------------------------------------------
; The DAC.  44100 is the board's default; an application that opens /dev/pcm0
; at another rate gets it - the driver reopens with the new divider - which is
; what STOMP does, because the amplifier is fitted at 22.05 kHz.
; ---------------------------------------------------------------------------
[audio]
mclk = 3
ws   = 4
bclk = 5
dout = 6
rate = 44100
