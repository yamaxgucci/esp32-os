; ArgonOS - Waveshare ESP32-S3-Zero with a CS4344 (CJMCU-4344) I2S DAC.
;
; Copy it onto the board's own flash as C:\BOARD.CFG - there is no card on this
; machine, and these are the pins the system needs before it can reach anything:
;
;   python tools\boardtest.py -p COM6 --put "boards\esp32s3-zero\BOARD.CFG=c:\BOARD.CFG"
;
; Pins per the working AcidBox config.  The CS4344 needs a precise master clock,
; and the kernel switches the I2S to the APLL when audio.mclk is set.

[board]
name = esp32s3-zero
; The chip, so that a C: image cannot be laid out for the wrong board.
; The partition tables differ between them - where C: starts and how
; big it is - and an image built against the wrong one lands at the
; wrong offset or takes half the room it should.  Both mount.  Both
; work.  One of them runs out of space months later.
chip = esp32s3

; ---------------------------------------------------------------------------
; No panel is wired to this board, and the soft framebuffer is kept anyway.
;
; `driver = none` would be the honest description of the hardware and the wrong
; setting for what this board is for: STOMP draws into the surface and nobody
; sees it, so the processor pays exactly what it would pay behind a screen.  A
; measurement taken with the drawing switched off is a measurement of a
; different program.
;
; 320x240 is a pedal's screen rather than the 640x400 default, and it comes out
; of PSRAM (ag_port_alloc asks for slow memory first), so the 186 KB of internal
; RAM the system lives in is untouched.
; ---------------------------------------------------------------------------
[display]
driver = soft
width  = 320
height = 240

; ---------------------------------------------------------------------------
; The DAC.  44100 is the board's default; an application that opens /dev/pcm0
; at another rate gets it - the driver reopens with the new divider - which is
; what STOMP does, because the amplifier is fitted at 22.05 kHz.
; ---------------------------------------------------------------------------
[audio]
mclk = 3
ws   = 4
bclk = 5
dout = 6
rate = 44100

; ---------------------------------------------------------------------------
; ONE WIRE, TO THE C3.  This board is a LEAF, and the C3 is the middle.
;
; An earlier draft of this file had two wires and this board in the middle,
; which is what the pins allow: the CYD cannot be the middle (three free pins,
; 21, 22 and 35, and its own wire already uses two of them) and this board has
; castellations to spare.  It is not what to build, because making this board
; the middle means UNSOLDERING the CYD-C3 pair - and that pair is the one that
; has been proved on hardware, 39 checks of 39.  A third board adds to what
; works rather than rearranging it.  So the C3 holds both wires: it has two
; UARTs and had one spare, which is exactly enough and no more.
;
; Pins chosen around what is already spoken for: 3-6 are the DAC above, 19/20
; are USB, 43/44 are the UART0 pads.  Check them against the silkscreen before
; soldering - a board that looks like this one is not always wired like it.
;
;   uart1  GPIO 7 (tx)  -> C3 GPIO 1 (rx)
;          GPIO 8 (rx)  <- C3 GPIO 0 (tx)
;   GND    common to both boards.  Without it the wire works "almost", which
;          is the worst way for a wire to work.
;
; 7 AND 8 RATHER THAN 8 AND 9, and the reason is the SPI link that comes next.
; SPI2 on this chip has native pins (esp-idf soc/esp32s3/spi_pins.h):
;
;   HD 9   CS 10   MOSI 11   CLK 12   MISO 13   WP 14
;
; Through the GPIO matrix instead of those, a link runs at half the clock.  The
; first draft of this file had the UART on 8 and 9 - and 9 is HD, the fourth
; data line of a QUAD link.  Moving one pin leaves 9 to 14 whole: this board
; can carry a four-wire SPI link (10..13) beside this UART today, and a quad
; one (9..14) later without touching the UART at all.
;
; That is the better half of this pair.  The C3 cannot do the same - its own
; native MISO is a strapping pin and its native HD is the wire to the CYD - so
; the constraint on a fast link lives over there; see its BOARD.CFG.
;
; Two transports on one pair of boards is the only way to measure one against
; the other honestly - see "SPI на новом проводе" in docs/plans/cluster.md.
;
; The baud here is the port's resting speed; SYSTEM.CFG raises the wire to
; 921600 when it binds it.
; ---------------------------------------------------------------------------
[uart1]
tx   = 7
rx   = 8
baud = 115200

; ---------------------------------------------------------------------------
; UART2 - NOT a wire between two running systems.  THIS BOARD FLASHES THE C3.
;
; The C3 sits on a power bank with no data cable of its own, so the only way
; new firmware reaches it is through here: ESPFLASH.AXE on this board talks the
; ROM loader's own protocol down this port.
;
;   uart2  GPIO 1 (tx)  -> C3 GPIO 20  (U0RXD - the ROM's receiver)
;          GPIO 2 (rx)  <- C3 GPIO 21  (U0TXD)
;   GND    already common; the cluster wire needs it too.
;
; THE FAR END IS THE ROM, NOT ARGONOS, and those are different pins from the
; cluster wire on purpose: 20 and 21 are where the C3's first-stage ROM listens
; and prints, whatever its running system has told the pin matrix afterwards.
; They are free over there precisely because we refused to hang a wire on them
; for anything else - see that board's BOARD.CFG.
;
; HOW THE C3 GETS INTO THE LOADER: `reboot /download` on the C3 - the newer
; parts have a bit the first-stage ROM reads, and the classic way (hold the
; boot strap low, pulse the reset line) is not available because the C3
; SuperMini does not bring its reset line out at all.  Say it over telnet; the
; C3 has no console on the desk.
;
;   run c:\espflash.axe write c:\argonos.bin -a 0x10000 -p 2 -c esp32c3
;
; -c esp32c3 rather than auto: esptool tells the newer C-series apart with
; GET_SECURITY_INFO rather than the magic register ESPFLASH detects by.
;
; And it does NOT come back by itself.  The download bit lives in the RTC
; domain, a reset does not clear it and nothing in the ROM clears it either -
; so when the flashing is done, pull the power bank out and put it back.  That
; is the one touch this arrangement costs, and it is the price of a board whose
; reset line is not on the header.
; ---------------------------------------------------------------------------
[uart2]
tx   = 1
rx   = 2
baud = 115200

; ---------------------------------------------------------------------------
; SPI2 - the fast link, on the pads this peripheral owns.
;
; 10..13 are SPI2's OWN IOMUX pins on this chip (the note above about 9..14),
; so the link runs on the peripheral's native pins instead of through the GPIO
; matrix, which is worth a factor and costs this board nothing: it has no panel
; and no card, so the bus is otherwise unused.
;
;   CS 10   MOSI 11   CLK 12   MISO 13
;
; 9 is left alone on purpose - it is the fourth data line of a quad link, which
; is the step after this one, and 14 is WP.
;
; THE DRIVE IS PART OF THE WIRING, NOT A PREFERENCE.  Measured on this pair on
; 22 Sep: at the pad drive the chip comes up with, the same wire, the same pins
; and the same code gave 0 clean frames of 4000 at 1 MHz, and at the weakest
; drive 4000 of 4000 from 1 to 40 MHz - 1 755 781 B/s of payload.  Both ends
; must set it.  Nothing about the failure looks like a drive problem, which is
; exactly why the number is written down here rather than left to a default.
; See "Привод площадок: CAP_0" in docs/plans/cluster.md.
;
; khz is the bus's own default; linkspi.sys names the rate it actually runs at.
; ---------------------------------------------------------------------------
[spi2]
sck   = 12
mosi  = 11
miso  = 13
khz   = 20000
drive = 0
