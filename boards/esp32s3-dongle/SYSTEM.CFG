; ArgonOS USB-KVM dongle (LilyGo T-Dongle-S3).  No [wifi] here: a fresh dongle
; has no network until the agent configures it (it writes /sys/KVMCFG.TXT and
; joins).

; Light up the soldered ST7735S panel at boot.  The driver turns the backlight
; on and mirrors the console - including KVM.AXE's "open http://<ip>/" line - to
; the glass, so the stick can be read without a phone.  mksysfs stages the file
; (modules.txt); this is what tells the kernel to load it.
[modules]
device = c:\drv\st7735td.sys

; Size the text console to the panel, not the compiled-in 80x25.  `auto` asks
; the panel (8x8 cells on this 160x80 glass -> 20x10), so the prompt and command
; output fit on the little screen instead of running off the right and bottom
; edges.  Applied at the devices stage, after the panel driver is up.
[console]
cols = auto
rows = auto
