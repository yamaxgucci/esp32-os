; ArgonOS - LilyGo T-Dongle-S3 as a USB-KVM dongle, with its soldered 0.96 inch
; ST7735S panel.  Lives on the board's own flash as C:\BOARD.CFG and overrides
; the compiled-in defaults.  Same silicon as the S3-CAM (ESP32-S3R8, 16 MB flash,
; 8 MB octal PSRAM), so the esp32s3-kvm firmware runs here unchanged - only the
; screen differs, and there is no camera and no card.
[board]
name = esp32s3-dongle
chip = esp32s3

; The panel's bus, taken from the firmware already proven on this board
; (DeepSeek esp32-kvm): clock 10, data 11, 40 MHz.  No MISO, this panel cannot
; be read.  The control lines (CS 12, DC 13, RST 14; no software backlight) are
; compiled into ST7735TD.SYS.  These are NOT the pins a generic T-Dongle-S3
; datasheet lists - this board is wired its own way.
[spi2]
sck  = 10
mosi = 11
miso = -1
khz  = 40000

; No microSD slot in use.  The firmware is built for the S3-CAM, whose compiled
; defaults put an SDMMC card on GPIO 14 (CLK), 15 (CMD) and 2 (D0) - and 14 is
; this panel's reset line.  Without this the card driver reserves those pins at
; boot (it fails to mount, there being no card, but keeps the pins), and the
; panel driver then cannot take 14: ag_driver_init returns -AG_EBUSY and the
; screen stays black with the backlight lit.  `interface = none` is the board
; saying it has no card, which frees the pins.  Found on the board 27 Oct 2026
; via `io` (pin 14 = "sd clk").
[sd]
interface = none

; The system framebuffer is soft and sized to the glass (160x80); ST7735TD.SYS
; shows it, and KVM.AXE paints the dongle's address and state there so the stick
; can be read without a phone - the only readout it has, with no console.
[display]
driver = soft
width  = 160
height = 80
