; ArgonOS - Waveshare ESP32-C6-LCD-1.47.
;
; Copy this onto the board's own flash as C:\BOARD.CFG.  It cannot be read from
; the SD card: these are the pins the system needs in order to reach the card
; in the first place.  From a development machine:
;
;   python tools\boardtest.py -p COM5 --put "boards\esp32-c6-lcd-1.47\BOARD.CFG=c:\board.cfg"
;
; On the board itself:  edit c:\board.cfg
;
; The part is an ESP32-C6-WROOM-1: RISC-V, 4 MB flash, 512 KB SRAM, no PSRAM.
; The USB-C socket goes to the chip's own USB pins (12 and 13) - there is no
; bridge chip on this board - so the console is the built-in USB serial device
; and UART0 (16, 17) is free, on the header, for whatever wants it.

[board]
name = esp32-c6-lcd-1.47

; ---------------------------------------------------------------------------
; One bus, two chips, and that is the thing about this board.
;
; The panel and the card slot share SCK and MOSI and are told apart only by
; chip select: 14 is the display, 4 is the card.  MISO (5) goes to the card
; alone - the panel is write-only here, which is why nothing can read the
; ST7789's ID register and why the display driver cannot check its own work.
;
; The consequence is a rule rather than a setting: whichever of them speaks
; must have the other's chip select high, and the port's SPI layer keeps one
; device per chip select with its own clock so that neither has to know about
; the other.  Both are on SPI2 because SPI2 is the only general-purpose SPI
; this part has.
;
; The pins are also *not* SPI2's IOMUX pins (which would be clock 6, MOSI 7 -
; the board wires them the other way round), so every transfer goes through the
; GPIO matrix.  That is what caps the clock at 40 MHz rather than 80, and it is
; a fact about the board rather than something to tune out.
; ---------------------------------------------------------------------------
[spi2]
sck  = 7
mosi = 6
miso = 5
khz  = 40000

; ---------------------------------------------------------------------------
; SD card - drive A:.  SPI, because this part has no SDMMC host at all: the
; peripheral does not exist on a C6, and `interface = sdmmc` here is answered
; rather than obeyed.
;
; 20 MHz to start.  The card slot is on the same wires as a panel being driven
; at 40, and a card that mounts and then reads garbage is the first thing to
; blame on this number.
; ---------------------------------------------------------------------------
[sd]
interface = spi
spi_host  = 2
sck       = 7
mosi      = 6
miso      = 5
cs        = 4
max_khz   = 20000

; ---------------------------------------------------------------------------
; Display - ST7789, 172x320 portrait, driven landscape as 320x172.
;
; Two different things share this glass, as on every board here:
;
;   The console arrives at the panel as characters - c:\st7789.sys turns one
;   row of cells at a time into pixels - and that is what is on the screen at
;   the prompt.  Forty columns by twenty-one rows: 320/8 by 172/8, with four
;   pixels at the bottom that no cell fits into.
;
;   There is no system framebuffer, and that is the setting below.  `panel`
;   means applications bring their own pixels and hand the driver one band at a
;   time (gfx->present); `soft` would give them one surface the kernel owns.
;
; Why `panel` on this board, measured rather than assumed:
;
;   soft, 160x86    72 KB free.  An application's picture is 160x86 and the
;                   driver doubles it onto the glass, so everything is drawn at
;                   half the resolution the panel has.
;   panel           152 KB free.  An application draws at 320x172, one to one.
;
; Eighty kilobytes, because the soft path is not one buffer: front, back and
; the snapshot the console is restored from are 27 KB each.  On a chip whose
; whole heap is 240 KB that is a third of it, spent to then throw away half the
; resolution.  Marauder's menu is the clearest case - one item filled the
; screen at 160x86, four fit at 320x172.
;
; What it costs: an application that asks the kernel for a surface gets nothing
; (GFXDEMO), and `gfxdump` has no buffer to write.  Applications that push
; their own bands are unaffected - `gfxpix own`, MARAUDER, the emulators.  Put
; `driver = soft` back, with a width and height, if a surface is wanted; the
; console on the glass is the ST7789 driver's own text path either way and does
; not depend on this at all.
;
; Control lines are not in this file: a driver cannot read BOARD.CFG (api->cfg
; is NULL), so DC 15, RST 21 and the backlight on 22 are constants inside
; apps/st7789/st7789.c.  They are written down here as well because a wrong
; guess there drives a pin belonging to something else.
;
;   chip select     GPIO 14
;   data / command  GPIO 15
;   reset           GPIO 21
;   backlight       GPIO 22, active high
; ---------------------------------------------------------------------------
[display]
driver = panel

; ---------------------------------------------------------------------------
; The rest of the board, read off the silkscreen and the schematic.
;
;   RGB LED         one WS2812 on GPIO 8 - a serial protocol, not three pins,
;                   and GPIO 8 is also a strapping pin: it is sampled at reset
;                   and must not be held low by anything at that moment.
;   BOOT button     GPIO 9, active low, doubles as the download-mode strap
;   UART0           GPIO 16 (TX) and 17 (RX) on the header, and free: the
;                   console is on USB, so these are an application's to take.
;   USB             GPIO 12 (D-) and 13 (D+), straight to the Type-C socket.
;                   No bridge chip.  A reset does not drop the port.
;   power           5 V from USB, or the BAT connector with the onboard charger
;
; Do not configure GPIO 24..30: they are the flash lines inside the module, and
; 27 is the regulator that powers it.  The system refuses them, which is the
; point of the pin table.
; ---------------------------------------------------------------------------
