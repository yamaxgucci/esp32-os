; sfall settings, read by fallout2-ce from beside the executable.
;
; The opening movies play, as they do in the original, and a keypress skips
; them, as it does in the original.  That is a choice now rather than a coin
; toss: the engine read this key into an uninitialised variable, so whether the
; three movies played at all was decided by whatever had last been on the
; stack.  See patches/fallout2-ce/0009.
;
; Set it to 1 when measuring rather than playing.  The movies are the peak of
; the whole startup - the player's frame buffers cost about 730 KB, more than
; the game holds at its own main menu - and they take five minutes off the
; front of every run.

[Misc]
SkipOpeningMovies=0
