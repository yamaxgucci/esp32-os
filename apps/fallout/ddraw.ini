; sfall settings, read by fallout2-ce from beside the executable.
;
; One line here is about this machine rather than taste.  The opening movies
; are the peak of the whole startup: the player's frame buffers cost about
; 730 KB, more than the game holds at its own main menu.  Skipping them lowers
; the high-water mark by that much, and takes five and a half minutes off every
; test run into the bargain.
;
; Put it back when there is memory to spare and somebody wants to watch.
;
; NOT WORKING YET.  The file is on the card and `type a:\ddraw.ini` reads it,
; the equivalent command-line form - [Misc]SkipOpeningMovies=1 as one argument -
; arrives in argv intact, and the movies play either way.  Somewhere between
; sfallConfigInit reading this and falloutMain asking for the value it is
; being lost.  Unfinished, not abandoned.

[Misc]
SkipOpeningMovies=1
