; Fallout 2 on ArgonOS.  Copy to the root of the card, beside FALLOUT2.AXE
; and MASTER.DAT.
;
; Only two settings here are about this machine rather than taste, and both
; are about memory.  The process gets a six megabyte arena - what is left of
; 8 MB of PSRAM once the image's own 1.87 MB of data is in it (see the comment
; on AG_APP_SIZED in fallout_main.cc) - and that has to hold the art cache, the
; sound cache and everything the game allocates while it plays.
;
; The .DAT indices used to take 1.7 MB of that before the game drew anything.
; They are read out of flash now - see apps/fallout/tools/mkdatidx.py - so this
; file is what is left to argue about.
;
;   art_cache_size   megabytes, reserved whole at startup.  The stock value
;                    is 8, which cannot be had here - artInit then fails with
;                    "cache_init failed in art_init" and nothing else.
;   cache_size       the sound cache, in kilobytes.
;
; Everything below them is the game's own defaults, written out so that
; changing one is editing a line rather than discovering a key.

[system]
executable=game
master_dat=master.dat
critter_dat=critter.dat

; The patch directories are empty on purpose, and it is the single biggest
; thing on this list.
;
; They name a folder the engine searches before the archive, so that a loose
; file can override one inside it.  On a PC a lookup that finds nothing is
; free.  On a FAT card it is a directory walk, and the engine does one for
; every sprite it draws: measured on the Temple of Trials, 56 file opens per
; frame of which 56 found nothing, and the frame spent more than half its time
; on them.  Emptying these took the frame from 835 ms to 158 ms.
;
; What it costs: loose files under data\ no longer override the archive.  Put
; "data" back if you have patched art to install, and expect the frame rate
; back where it was until the lookups are made cheap - see the note on
; negative lookups in apps/fallout/README.md.
master_patches=
critter_patches=
language=english
art_cache_size=1
color_cycling=1
hashing=1
splash=0
free_space=20480
times_run=1

[preferences]
game_difficulty=1
combat_difficulty=1
violence_level=3
target_highlight=2
item_highlight=1
combat_messages=1
combat_taunts=1
language_filter=0
running=0
subtitles=0
combat_speed=0
player_speedup=0

[sound]
initialize=1
debug=1
device=-1
port=-1
irq=-1
dma=-1
sounds=1
music=1
speech=1
master_volume=22222
music_volume=22222
sndfx_volume=22222
speech_volume=22222
cache_size=64
music_path1=data\sound\music\
music_path2=data\sound\music\

[debug]
mode=environment
log_level=debug
show_tile_num=0
show_script_messages=0
show_load_info=0
output_map_data_info=0
