; Fallout 2 on ArgonOS.  Copy to the root of the card, beside FALLOUT2.AXE
; and MASTER.DAT.
;
; Only two settings here are about this machine rather than taste, and both
; are about memory.  The process gets a six megabyte arena - what is left of
; 8 MB of PSRAM once the image's own 1.87 MB of data is in it (see the comment
; on AG_APP_SIZED in fallout_main.cc) - and that has to hold the art cache, the
; sound cache and everything the game allocates while it plays.
;
; The .DAT indices used to take 1.7 MB of that before the game drew anything.
; They are read out of flash now - see apps/fallout/tools/mkdatidx.py - so this
; file is what is left to argue about.
;
;   art_cache_size   megabytes, reserved whole at startup.  The stock value
;                    is 8, which cannot be had here - artInit then fails with
;                    "cache_init failed in art_init" and nothing else.
;   cache_size       the sound cache, in kilobytes.
;
; Everything below them is the game's own defaults, written out so that
; changing one is editing a line rather than discovering a key.

[system]
executable=game
master_dat=master.dat
critter_dat=critter.dat

; The patch directories are empty, and it is no longer for the reason it was.
;
; They name a folder the engine searches before the archive so that a loose
; file can override one inside it.  The engine does one such lookup for every
; sprite it draws - 56 a frame on the Temple of Trials - and a lookup that
; finds nothing used to be a directory walk on the card, which cost more than
; half the frame.  That part is fixed: the VFS remembers what was not there.
;
; What is left is memory, and where it goes has not been established.  With
; the folder in the search path the arena runs about 75 KB shorter, and on
; 8 MB of PSRAM that is the difference between the game getting its 256 KB of
; music buffer at the main menu and giving up there.  Put "data" back if you
; have both patched art to install and the memory to hold it.
; ARGON: this must NOT be empty, and the reason is saving, not art.
;
; Saving a game enumerates MAPS\*.SAV, and the engine enumerates only inside
; its "bases": the .DAT archives and the directories in this search path.  With
; nothing here there are no directories in it, so the map file the save has
; just written to the card cannot be seen, fileNameListInit returns zero, and
; loadsave.cc treats zero as failure - "Error writing save function #3 data".
; Opening a file by name still worked all along, because xfileOpen falls back
; to a plain fopen and enumeration has no such fallback.
;
; Setting it to /sd was tried and does not work: the engine then fails to
; find its fonts and exits before the menu.  Saving is fixed in the engine
; instead - see patches/fallout2-ce/0039, which gives enumeration the same
; fallback that opening a file has had all along.
master_patches=
critter_patches=
language=english
; In kilobytes, not megabytes: see patches/fallout2-ce/0012.  The setting is
; whole megabytes in the original, which is too coarse a dial when the whole
; arena has a hundred kilobytes to spare.
;
; 1800, and every number in this note was paid for.
;
; The mistake that ran through all of it: this was measured on the Temple of
; Trials, which is the smallest map in the game, and on the temple any cache
; over a megabyte reads nothing and evicts nothing.  On Arroyo village, with
; -autostart and nobody at the keyboard, a 1400 KB cache reads 615 to 732
; entries every thirty seconds and evicts as many.  Maxim's own play session had
; 10153 evictions and 18 full cache flushes in it, and felt like five frames a
; second while the counter said twenty.  At 1800 the same map reads 54 to 195.
;
; Four times less, for 400 KB - which is what patch 0020 freed out of the world
; map's oversized arrays, so it costs nothing that was being used.
;
; The ceiling: more is wasted.  3000 KB instead of 1400 moved the arena's
; high-water mark by 1608 KB, which is the extra cache and nothing else.  The
; working set does not shrink; it sits somewhere with a different label.
;
; The floor is hard: **one art item in this game is 505100 bytes**.  A 600 KB
; cache cannot hold it once the cache has holes, so the request falls through
; heap.cc's `system:` label into the arena, and a short arena makes that fatal -
; "Could not allocate block of 505100 bytes", then "fatal error:
; internal_malloc() failed in heap_find_free_block()".  Which is why turning the
; cache *down* to 600 left less free at the moment of failure than 800 did.
;
; And the middle, which is the part a high-water mark cannot see.  1000 KB
; measures beautifully on the temple - eleven entries read in a three-second
; window, none evicted, 4% off the frame rate, 404 KB back - and plays badly:
; walking and scrolling stutter, because the cache is re-reading the map's tiles
; from the card while the frame counter goes on counting frames.  Under pressure
; it is worse: with a busy map resident, the options menu, the character editor
; and the skilldex fail to load their art, and a skilldex that returns an error
; leaves the game in a mode with no way out.
;
; What about the largest map?  BROKEN2.MAP runs out of arena at 1400, 1600 and
; 1800 alike - with 20, 32 and 24 KB free, always on the same 32 KB inflate
; window.  The cache size does not reach it: whatever is not in the cache spills
; into the arena through heap.cc's `system:` label and fills it either way.  So
; there is nothing to protect by keeping this small, and that map needs the work
; still listed in docs/plans/fallout-memory.md rather than a smaller cache.
;
; -artcache N overrides this from the command line, which is how to find the
; right number on a part with more memory, or during a real game rather than a
; run with -autostart.
art_cache_size=1800
color_cycling=1
hashing=1
splash=0
free_space=20480
times_run=1

[preferences]
game_difficulty=1
combat_difficulty=1
violence_level=3
target_highlight=2
item_highlight=1
combat_messages=1
combat_taunts=1
language_filter=0
running=0
subtitles=0
combat_speed=0
player_speedup=0

[sound]
initialize=1
debug=1
device=-1
port=-1
irq=-1
dma=-1
sounds=1
music=1
speech=1
master_volume=22222
music_volume=22222
sndfx_volume=22222
speech_volume=22222
cache_size=64
music_path1=data\sound\music\
music_path2=data\sound\music\

[debug]
mode=environment
log_level=debug
show_tile_num=0
show_script_messages=0
show_load_info=0
output_map_data_info=0
