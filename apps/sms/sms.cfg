# ArgonOS SMS controls (two pads).  Copy next to the ROM or onto H:\ / A:\.
# Names: UP DOWN LEFT RIGHT ENTER ESC SPACE TAB A..Z 0..9 F1..F12
#         KP0..KP9 KPENTER KPPLUS KPMINUS KPMUL KPDIV
#
# When argon run -HostFs is used, hostfsd reads this file and exposes a live
# H:\sms.pad (level keyboard state).  That is what makes diagonals and
# move+fire work in QEMU.  Without HostFS, SMS falls back to serial KEY_DOWN
# sticky keys (imperfect).

pad0.up=UP
pad0.down=DOWN
pad0.left=LEFT
pad0.right=RIGHT
pad0.b1=Z
pad0.b2=X
pad0.pause=ENTER
pad0.quit=ESC

pad1.up=W
pad1.down=S
pad1.left=A
pad1.right=D
pad1.b1=J
pad1.b2=K
pad1.pause=P
pad1.quit=Q
