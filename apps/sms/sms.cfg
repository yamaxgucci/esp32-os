# ArgonOS pad bindings (two pads).  Copy next to the ROM or onto H:\ / A:\.
# Names: UP DOWN LEFT RIGHT ENTER ESC SPACE TAB A..Z 0..9 F1..F12
#         KP0..KP9 KPENTER KPPLUS KPMINUS KPMUL KPDIV
#
# When argon run -HostFs is used, hostfsd reads this file and PADPUSH-es a live
# snapshot (~60 Hz) into the guest input layer (/dev/joy0, inp->pad/btn).
# H:\sms.pad is the same cache as a compatibility file.  Low actions:
#   up down left right b1/a b2/b
# High actions (Mega Drive six-button / Start):
#   c start x y z mode
# Sys:
#   pause quit
#
# Without HostFS, apps fall back to serial sticky keys (no real key-up).
#
# Video (guest SMS.AXE reads this too):
#   fullscreen=1  — nearest-neighbor stretch to the soft display (640x400)
#   fullscreen=0  — centered 1:1

fullscreen=1

pad0.up=UP
pad0.down=DOWN
pad0.left=LEFT
pad0.right=RIGHT
pad0.b1=Z
pad0.b2=X
pad0.c=C
pad0.start=ENTER
pad0.pause=ENTER
pad0.quit=ESC

pad1.up=W
pad1.down=S
pad1.left=A
pad1.right=D
pad1.b1=J
pad1.b2=K
pad1.c=L
pad1.start=P
pad1.pause=P
pad1.quit=Q
