# Local equivalent: argon check (host tests + idf.py build + argon apps).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++

      - name: Configure and build host tests
        run: |
          cmake -S host-tests -B build-host -G Ninja
          cmake --build build-host

      - name: Run ctest
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: idf.py build

  apps:
    # Applications link separately from the firmware, so a green firmware
    # build says nothing about them.  Without this, a change under
    # apps/common could break every .AXE in the tree unnoticed.
    name: Applications (.AXE / .SYS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build every image in tools/apps.json
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: python tools/build_apps.py --warnings
