## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # The framebuffer device Espressif's QEMU emulates.  Fetched only when the
  # image is for a machine an emulator runs (CONFIG_ARGON_PANEL_QEMU); it does
  # not compile for the RISC-V parts, which no QEMU of ours runs anyway.
  espressif/esp_lcd_qemu_rgb:
    version: "^1.0.2"
    rules:
      - if: "$CONFIG{ARGON_PANEL_QEMU} == True"
  joltwallet/littlefs: "^1.14.0"
  # The whole camera in the image, sensor drivers and all - fetched only when
  # CONFIG_ARGON_CAMERA_BUILTIN is set (argon target esp32s3-cam).  A default
  # build never downloads it: see camera_builtin_hw.c and the port CMakeLists.
  espressif/esp32-camera:
    version: "^2.0.0"
    rules:
      - if: "$CONFIG{ARGON_CAMERA_BUILTIN} == True"
