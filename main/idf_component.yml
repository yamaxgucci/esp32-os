## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # The framebuffer device Espressif's QEMU emulates.  Fetched only when the
  # image is for a machine an emulator runs (CONFIG_ARGON_PANEL_QEMU); it does
  # not compile for the RISC-V parts, which no QEMU of ours runs anyway.
  espressif/esp_lcd_qemu_rgb:
    version: "^1.0.2"
    rules:
      - if: "$CONFIG{ARGON_PANEL_QEMU} == True"
  joltwallet/littlefs: "^1.14.0"
  # mDNS, so a board answers to a name (argon.local) rather than the address
  # DHCP happened to hand it.  Small, and only linked when the build has a
  # network at all.
  espressif/mdns:
    version: "^1.2.0"
    rules:
      - if: "$CONFIG{ARGON_ENABLE_NET} == True"
  # The whole camera in the image, sensor drivers and all - fetched only when
  # CONFIG_ARGON_CAMERA_BUILTIN is set (argon target esp32s3-cam).  A default
  # build never downloads it: see camera_builtin_hw.c and the port CMakeLists.
  espressif/esp32-camera:
    version: "^2.0.0"
    rules:
      - if: "$CONFIG{ARGON_CAMERA_BUILTIN} == True"
  # The USB device stack, for the board that is a keyboard rather than has one
  # (`argon target esp32s3-kvm`).  Whether any of it is compiled is decided by
  # CONFIG_ARGON_USB_DEVICE in the port's CMakeLists, not here.
  #
  # The condition is SOC_USB_OTG_SUPPORTED and not CONFIG_ARGON_USB_DEVICE, and
  # that is a fix rather than a slip: ARGON_USB_DEVICE is `depends on
  # !ARGON_USB_HOST`, so on a board that HAS a USB host - this S3-CAM among them
  # - the symbol does not exist in sdkconfig at all, the component manager
  # cannot find it, and the whole configure dies with `Missing required kconfig
  # option after retry` before a single file is compiled.  Found on 22 Oct 2026,
  # on the first build after this block came back from the KVM work.
  # SOC_USB_OTG_SUPPORTED is an SoC capability and is always defined.
  espressif/esp_tinyusb:
    version: "^2.2.1"
    rules:
      - if: "$CONFIG{SOC_USB_OTG_SUPPORTED} == True"
